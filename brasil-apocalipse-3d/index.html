<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brasil em Apocalipse 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#g{position:relative;width:100%;height:100%}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;font-weight:800}.b{background:#0a1119cc;border:1px solid #fff3;border-radius:12px;padding:8px 11px}.controls{position:absolute;z-index:6;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 18px}.group{display:flex;gap:10px}.btn{width:72px;height:72px;border-radius:50%;border:2px solid #fff5;background:#182632dd;color:#fff;font-size:28px;font-weight:900}.fire{background:#a8372d}.screen{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#294454ee,#04070bee 72%)}.panel{max-width:410px;margin:18px;padding:28px 24px;text-align:center;background:#0d151df5;border:1px solid #8cbbd3aa;border-radius:24px}.panel h1{font-size:32px;margin:0 0 8px}.panel p{color:#ccd6de}.go{border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,#d94d40,#772018);color:#fff;font-weight:900;font-size:18px}</style></head><body><main id="g"><canvas id="c"></canvas><div class="hud"><div class="b">🇧🇷 BRASIL EM APOCALIPSE 3D</div><div class="b">❤️ <span id="hp">100</span></div></div><div class="controls"><div class="group"><button class="btn" id="l">◀</button><button class="btn" id="r">▶</button></div><div class="group"><button class="btn" id="u">▲</button><button class="btn" id="d">▼</button><button class="btn fire" id="f">🔫</button></div></div><div class="screen" id="s"><section class="panel"><h1>🇧🇷 Brasil em Apocalipse 3D</h1><p>Primeira versão 3D • terceira pessoa • exploração • zumbis.</p><p>Protótipo inicial em Palmeira dos Índios.</p><button class="go" id="go">COMEÇAR</button></section></div></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),screen=document.getElementById('s'),hpEl=document.getElementById('hp');let W=innerWidth,H=innerHeight,run=false,last=0,hp=100,shots=[],z=[];const keys={l:false,r:false,u:false,d:false};const p={x:0,z:0,a:0,v:0};const world={w:1800,d:1200};function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();function start(){run=true;screen.style.display='none';hp=100;z=[];shots=[];p.x=0;p.z=250;last=performance.now();for(let i=0;i<7;i++)z.push({x:-600+i*190,z:-120-i*55,hp:2,a:0});requestAnimationFrame(loop)}function project(wx,wz){const camX=p.x-Math.sin(p.a)*260,camZ=p.z-Math.cos(p.a)*260;const dx=wx-camX,dz=wz-camZ,ca=Math.cos(p.a),sa=Math.sin(p.a),side=dx*ca-dz*sa,depth=dx*sa+dz*ca+260;if(depth<20)return null;const f=Math.min(W,H)*.9/depth;return {x:W/2+side*f,y:H*.48+(0-depth*.003)*H,s:f}}function draw(){x.clearRect(0,0,W,H);const sky=x.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#172f3f');sky.addColorStop(1,'#78909b');x.fillStyle=sky;x.fillRect(0,0,W,H*.58);x.fillStyle='#273126';x.fillRect(0,H*.58,W,H*.42);for(let i=-8;i<=8;i++){const a=project(i*130,420);const b=project(i*130,-900);if(a&&b){x.strokeStyle='#46534a';x.lineWidth=3;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}for(let d=150;d<1200;d+=150){const a=project(-900,d),b=project(900,d);if(a&&b){x.strokeStyle='#3d493f';x.lineWidth=2;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}for(let i=-6;i<=6;i++){const bx=i*230;for(const side of [-1,1]){const o=project(bx,side*520);if(o){const h=o.s*130,w=o.s*150;x.fillStyle=i%2?'#5c5149':'#46545a';x.fillRect(o.x-w/2,o.y-h,w,h);x.fillStyle='#151c20';for(let yy=0;yy<3;yy++)for(let xx=0;xx<3;xx++)x.fillRect(o.x-w*.34+xx*w*.22,o.y-h*.8+yy*h*.25,w*.1,h*.12)}}}for(const q of z){const o=project(q.x,q.z);if(!o)continue;const h=o.s*70,w=o.s*34;x.fillStyle='#0008';x.beginPath();x.ellipse(o.x,o.y+4,w,5,0,0,7);x.fill();x.fillStyle=q.hp===1?'#789b6b':'#5b765f';x.fillRect(o.x-w/2,o.y-h*.62,w,h*.62);x.beginPath();x.arc(o.x,o.y-h*.72,w*.55,0,7);x.fill();x.fillStyle='#df5048';x.fillRect(o.x-w*.25,o.y-h*.77,w*.12,w*.12);x.fillRect(o.x+w*.13,o.y-h*.77,w*.12,w*.12)}const pp=project(p.x,p.z);if(pp){const h=pp.s*105,w=pp.s*42;x.fillStyle='#0008';x.beginPath();x.ellipse(pp.x,pp.y+5,w,7,0,0,7);x.fill();x.fillStyle='#293f55';x.fillRect(pp.x-w/2,pp.y-h*.62,w,h*.62);x.fillStyle='#c98e68';x.beginPath();x.arc(pp.x,pp.y-h*.75,w*.43,0,7);x.fill();x.fillStyle='#17191b';x.fillRect(pp.x-w*.4,pp.y-h*.94,w*.8,h*.18);x.strokeStyle='#b9c4cb';x.lineWidth=Math.max(2,pp.s*7);x.beginPath();x.moveTo(pp.x+w*.2,pp.y-h*.43);x.lineTo(pp.x+w*.65,pp.y-h*.32);x.stroke();x.fillStyle='#d7c6a1';x.fillRect(pp.x+w*.48,pp.y-h*.35,w*.38,h*.1)}}function update(dt){let dx=(keys.r?1:0)-(keys.l?1:0),dz=(keys.d?1:0)-(keys.u?1:0);if(dx||dz){const n=Math.hypot(dx,dz);dx/=n;dz/=n;p.x+=dx*210*dt;p.z+=dz*210*dt;p.a=Math.atan2(dx,dz)}p.x=Math.max(-850,Math.min(850,p.x));p.z=Math.max(-500,Math.min(550,p.z));for(const q of z){const a=Math.atan2(p.x-q.x,p.z-q.z);q.x+=Math.sin(a)*35*dt;q.z+=Math.cos(a)*35*dt;if(Math.hypot(p.x-q.x,p.z-q.z)<45)hp-=18*dt}for(const b of shots){b.life-=dt;b.x+=b.vx*dt;b.z+=b.vz*dt;for(const q of z)if(q.hp>0&&Math.hypot(b.x-q.x,b.z-q.z)<45){q.hp--;b.life=0}}shots=shots.filter(b=>b.life>0);z=z.filter(q=>q.hp>0);if(hp<=0){hp=100;z=[];for(let i=0;i<7;i++)z.push({x:-600+i*190,z:-120-i*55,hp:2})}hpEl.textContent=Math.ceil(hp)}function shoot(){if(!run)return;const a=p.a;shots.push({x:p.x+Math.sin(a)*35,z:p.z+Math.cos(a)*35,vx:Math.sin(a)*620,vz:Math.cos(a)*620,life:1.2})}function loop(t){if(!run)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}function bind(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}bind('l','l');bind('r','r');bind('u','u');bind('d','d');document.getElementById('f').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=true;if(e.key==='ArrowRight'||e.key==='d')keys.r=true;if(e.key==='ArrowUp'||e.key==='w')keys.u=true;if(e.key==='ArrowDown'||e.key==='s')keys.d=true;if(e.code==='Space')shoot()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;if(e.key==='ArrowRight'||e.key==='d')keys.r=false;if(e.key==='ArrowUp'||e.key==='w')keys.u=false;if(e.key==='ArrowDown'||e.key==='s')keys.d=false});document.getElementById('go').onclick=start})()</script></body></html>
