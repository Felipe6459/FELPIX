<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FELPIX — Aventura em cada fase</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}#game{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:2px 2px #222}.badge{background:#111a;border:1px solid #fff4;border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px)}.controls{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.pad,.jump{display:flex;gap:12px}.btn{pointer-events:auto;width:68px;height:68px;border:1px solid #fff5;border-radius:18px;background:#111b;color:#fff;font-size:28px;font-weight:900;display:grid;place-items:center;touch-action:none}.jump .btn{width:80px;background:#5b3bb5}.message{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.panel{pointer-events:auto;text-align:center;background:#10131eee;border:1px solid #fff3;border-radius:22px;padding:24px;max-width:340px;margin:20px}.panel h1{margin:0 0 6px;font-size:40px;letter-spacing:2px}.panel p{color:#cbd1dc}.start{border:0;border-radius:14px;padding:13px 24px;background:#8b5cf6;color:#fff;font-weight:900;font-size:17px;touch-action:manipulation}.hidden{display:none!important}@media(min-width:800px){.controls{max-width:700px;margin:auto}.btn{opacity:.8}}
</style>
</head>
<body><main id="game"><canvas id="canvas"></canvas>
<div class="hud"><div class="badge">FELPIX • FASE <span id="level">1</span></div><div class="badge">❤️ <span id="lives">3</span> &nbsp; 🪙 <span id="coins">0</span> &nbsp; ⭐ <span id="score">0</span></div></div>
<div id="message" class="message"><section class="panel"><h1>FELPIX</h1><p>Corra, pule, colete moedas e encontre o cogumelo mágico!</p><button class="start" id="start">JOGAR</button></section></div>
<div class="controls"><div class="pad"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="jump"><button class="btn" id="jump">▲</button></div></div></main>
<script>
(()=>{
const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),coinEl=document.querySelector('#coins'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),levelEl=document.querySelector('#level'),msg=document.querySelector('#message'),start=document.querySelector('#start');
let W=0,H=0,running=false,last=0,coins=0,score=0,lives=3,level=1,powered=false,invuln=0,audio=null,musicTimer=null,musicStep=0;
const p={x:80,y:0,w:34,h:46,vx:0,vy:0,on:false};const keys={l:false,r:false};let world={w:4200,ground:0};
const level1=[{x:0,y:0,w:720,h:70},{x:850,y:0,w:500,h:70},{x:1500,y:0,w:620,h:70},{x:2280,y:0,w:700,h:70},{x:3150,y:0,w:1050,h:70},{x:470,y:150,w:150,h:24},{x:1030,y:145,w:170,h:24},{x:1730,y:160,w:190,h:24},{x:2500,y:140,w:190,h:24},{x:3440,y:170,w:220,h:24}];
const level2=[{x:0,y:0,w:520,h:70},{x:680,y:0,w:440,h:70},{x:1300,y:0,w:560,h:70},{x:2040,y:0,w:420,h:70},{x:2660,y:0,w:520,h:70},{x:3380,y:0,w:820,h:70},{x:300,y:145,w:150,h:24},{x:820,y:190,w:170,h:24},{x:1450,y:145,w:180,h:24},{x:2180,y:180,w:170,h:24},{x:2800,y:140,w:180,h:24},{x:3550,y:190,w:190,h:24}];
let platforms=level1;
const starts={1:[250,520,930,1110,1630,1800,2410,2580,3330,3500],2:[180,380,760,930,1380,1550,2130,2300,2730,2900,3500,3700]};
const enemyStarts={1:[610,1190,1900,2760,3700],2:[430,970,1560,2350,3050,3740]};
let items=[],enemies=[],mushroom={x:0,y:95,got:false,v:1};
function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=Math.floor(W*d);c.height=Math.floor(H*d);ctx.setTransform(d,0,0,d,0,0);world.ground=H-120}addEventListener('resize',resize);resize();
function top(q){return world.ground-q.y-q.h}
function buildLevel(){platforms=level===1?level1:level2;world.w=level===1?4200:4200;items=starts[level].map((x,i)=>({x,y:i%2?195:100,got:false}));enemies=enemyStarts[level].map((x,i)=>({x,y:0,w:34,h:30,v:i%2?-1:1,dead:false}));mushroom={x:level===1?700:1200,y:95,got:false,v:1}}
function resetPlayer(){p.x=80;p.y=top(platforms[0])-p.h;p.vx=0;p.vy=0;p.on=true;invuln=1.5}
function resetGame(){coins=score=0;lives=3;level=1;powered=false;levelEl.textContent='1';coinEl.textContent='0';scoreEl.textContent='0';livesEl.textContent='3';buildLevel();resetPlayer()}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function bindHold(id,key){const b=document.querySelector(id);const on=e=>{e.preventDefault();keys[key]=true};const off=e=>{e.preventDefault();keys[key]=false};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off))}bindHold('#left','l');bindHold('#right','r');
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();if(p.on){p.vy=-720;p.on=false;jumpSound()}});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=true;if(e.key==='ArrowRight'||e.key==='d')keys.r=true;if((e.key==='ArrowUp'||e.key==='w'||e.code==='Space')&&p.on){p.vy=-720;p.on=false;jumpSound()}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;if(e.key==='ArrowRight'||e.key==='d')keys.r=false});
function beep(freq,dur=.12,type='square',gain=.025){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function jumpSound(){beep(520,.08,'square',.025);setTimeout(()=>beep(760,.08,'square',.02),55)}function coinSound(){beep(880,.06,'sine',.035);setTimeout(()=>beep(1320,.08,'sine',.025),55)}function powerSound(){[440,660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.11,'triangle',.04),i*70))}function deathSong(){[330,262,196,131].forEach((f,i)=>setTimeout(()=>beep(f,.24,'triangle',.045),i*170))}
const melody=[523,659,784,659,587,698,880,698,523,659,784,988,880,784,659,587];
function musicTick(){beep(melody[musicStep%melody.length],.15,'square',.012);if(musicStep%4===0)beep(melody[(musicStep+8)%melody.length]/2,.22,'triangle',.008);musicStep++}
function startMusic(){if(musicTimer)clearInterval(musicTimer);musicStep=0;musicTick();musicTimer=setInterval(musicTick,190)}function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startGame(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();startMusic();resetGame();running=true;msg.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
start.addEventListener('click',startGame);
function loseLife(){deathSong();lives--;livesEl.textContent=lives;if(lives<=0){running=false;stopMusic();msg.innerHTML='<section class="panel"><h1>GAME OVER</h1><p>Suas vidas acabaram.<br>Pontuação: <b>'+score+'</b></p><button class="start" id="again">JOGAR NOVAMENTE</button></section>';msg.classList.remove('hidden');document.querySelector('#again').onclick=startGame;return}powered=false;resetPlayer()}
function nextLevel(){if(level===1){level=2;levelEl.textContent='2';score+=1000;scoreEl.textContent=score;buildLevel();resetPlayer();powerSound();msg.innerHTML='<section class="panel"><h1>FASE 2!</h1><p>Agora ficou mais difícil. Boa sorte!</p><button class="start" id="continue">CONTINUAR</button></section>';msg.classList.remove('hidden');running=false;document.querySelector('#continue').onclick=()=>{msg.classList.add('hidden');running=true;last=performance.now();startMusic();requestAnimationFrame(loop)}}else{running=false;stopMusic();msg.innerHTML='<section class="panel"><h1>FASES 1 E 2!</h1><p>Você venceu as duas fases!<br>Pontuação: <b>'+score+'</b></p><button class="start" id="again">JOGAR NOVAMENTE</button></section>';msg.classList.remove('hidden');document.querySelector('#again').onclick=startGame}}
function update(dt){if(invuln>0)invuln-=dt;const accel=powered?2150:1850,speed=powered?390:340;if(keys.r)p.vx+=accel*dt;if(keys.l)p.vx-=accel*dt;p.vx*=Math.pow(.0008,dt);p.vx=Math.max(-speed,Math.min(speed,p.vx));p.vy+=1900*dt;const oy=p.y,oldBottom=oy+p.h;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;
for(const q of platforms){const t=top(q);if(p.x+p.w>q.x&&p.x<q.x+q.w&&oldBottom<=t+2&&p.y+p.h>=t&&p.vy>=0){p.y=t-p.h;p.vy=0;p.on=true}}
p.x=Math.max(0,Math.min(world.w-p.w,p.x));if(p.y>H+120){loseLife();return}
for(const it of items){const iy=world.ground-it.y;if(!it.got&&Math.abs(it.x-(p.x+p.w/2))<30&&Math.abs(iy-(p.y+p.h/2))<35){it.got=true;coins++;score+=100;coinEl.textContent=coins;scoreEl.textContent=score;coinSound()}}
if(!mushroom.got){mushroom.x+=mushroom.v*45*dt;const min=level===1?665:1165,max=level===1?815:1315;if(mushroom.x<min||mushroom.x>max)mushroom.v*=-1;const my=world.ground-mushroom.y;if(Math.abs(mushroom.x-(p.x+p.w/2))<34&&Math.abs(my-(p.y+p.h/2))<38){mushroom.got=true;powered=true;score+=500;scoreEl.textContent=score;powerSound()}}
for(const e of enemies){if(e.dead)continue;e.y=world.ground-e.h;e.x+=e.v*80*dt;if(e.x<50||e.x>world.w-100)e.v*=-1;if(!invuln&&hit(p,e)){if(p.vy>0&&p.y+p.h-e.y<22){p.vy=-520;score+=250;scoreEl.textContent=score;e.dead=true;beep(180,.12,'square',.03)}else if(powered){powered=false;beep(120,.15,'sawtooth',.025);p.vy=-400;invuln=1}else{loseLife();return}}}
if(p.x>4050)nextLevel()}
function draw(){ctx.clearRect(0,0,W,H);const cam=Math.max(0,Math.min(world.w-W,p.x-W*.35));ctx.save();ctx.translate(-cam,0);ctx.fillStyle=level===1?'#72c8ff':'#f5b86b';ctx.fillRect(cam,0,W,H);for(let i=0;i<18;i++){ctx.fillStyle=level===1?(i%2?'#ffffff55':'#ffffff33'):(i%2?'#fff2aa55':'#fff2aa33');ctx.beginPath();ctx.arc(i*280+100,100+(i%3)*55,30,0,Math.PI*2);ctx.fill()}
for(const q of platforms){const y=top(q);ctx.fillStyle=level===1?'#5a3b25':'#70402b';ctx.fillRect(q.x,y,q.w,q.h);ctx.fillStyle=level===1?'#72b84f':'#d58a45';ctx.fillRect(q.x,y,q.w,10)}
for(const it of items)if(!it.got){const y=world.ground-it.y;ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(it.x,y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4a3';ctx.beginPath();ctx.arc(it.x-3,y-3,3,0,Math.PI*2);ctx.fill()}
if(!mushroom.got){const y=world.ground-mushroom.y;ctx.fillStyle='#f04b55';ctx.beginPath();ctx.arc(mushroom.x,y-9,16,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mushroom.x-7,y-13,4,0,Math.PI*2);ctx.arc(mushroom.x+7,y-13,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4d7b0';ctx.fillRect(mushroom.x-12,y-9,24,13)}
for(const e of enemies)if(!e.dead){ctx.fillStyle='#713b4b';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#fff';ctx.fillRect(e.x+7,e.y+7,6,6);ctx.fillRect(e.x+21,e.y+7,6,6)}
const h=powered?54:46,w=powered?42:34,px=p.x-(w-p.w)/2,py=p.y-(h-p.h);ctx.globalAlpha=invuln>0&&Math.floor(invuln*12)%2===0?.45:1;ctx.fillStyle='#f2c49b';ctx.beginPath();ctx.arc(px+w/2,py+12,w*.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7046c7';ctx.fillRect(px+5,py+2,w-10,10);ctx.fillStyle='#a77cff';ctx.fillRect(px+2,py+10,w-4,7);ctx.fillStyle='#fff';ctx.fillRect(px+10,py+15,7,7);ctx.fillRect(px+w-17,py+15,7,7);ctx.fillStyle='#222';ctx.fillRect(px+13,py+18,3,4);ctx.fillRect(px+w-16,py+18,3,4);ctx.fillStyle='#5b3bb5';ctx.fillRect(px+5,py+24,w-10,h-32);ctx.fillStyle='#f2c49b';ctx.fillRect(px-2,py+26,8,18);ctx.fillRect(px+w-6,py+26,8,18);ctx.fillStyle='#f0d04f';ctx.fillRect(px+3,py+h-10,w-6,6);ctx.fillStyle='#34205e';ctx.fillRect(px+2,py+h-5,w/2-3,6);ctx.fillRect(px+w/2+1,py+h-5,w/2-3,6);ctx.fillStyle='#ef4f6d';ctx.fillRect(px+4,py+27,w-8,5);ctx.globalAlpha=1;if(powered){ctx.strokeStyle='#ffe36b';ctx.lineWidth=3;ctx.strokeRect(px-4,py-4,w+8,h+8)}
const goalX=4050;ctx.fillStyle='#f5d76e';ctx.fillRect(goalX,world.ground-170,12,170);ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.moveTo(goalX+12,world.ground-165);ctx.lineTo(goalX+90,world.ground-140);ctx.lineTo(goalX+12,world.ground-115);ctx.fill();ctx.restore()}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}draw();
})();
</script></body></html>
