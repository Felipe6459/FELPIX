name: Fix Rhino syntax v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate bossPhase declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s2,n=re.subn(r'(// RHINO BOSS STABLE:[^\\n]*\\n)const bossPhase=level;',r'\\1',s,count=1)
          if n != 1:
              raise SystemExit(f'expected one duplicate declaration, found {n}')
          p.write_text(s2)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Rhino renderer syntax v2'
          rm -f .github/workflows/fix-rhino-syntax-v2.yml .github/workflows/fix-rhino-syntax.yml
          git add -A .github/workflows
          git commit -m 'Remove temporary Rhino syntax workflows' || true
          git push