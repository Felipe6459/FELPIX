name: Fix Rhino syntax v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename outer boss phase variable
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='if(boss&&!boss.dead&&boss.active){boss.y=groundY(boss.h);const bossPhase=level;x.save();'
          new='if(boss&&!boss.dead&&boss.active){boss.y=groundY(boss.h);const bossLevel=level;x.save();'
          if old not in s:
              raise SystemExit('outer bossPhase declaration not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Rhino duplicate variable syntax'
          rm -f .github/workflows/fix-rhino-syntax-v3.yml .github/workflows/fix-rhino-syntax-v2.yml .github/workflows/fix-rhino-syntax.yml
          git add -A .github/workflows
          git commit -m 'Remove temporary Rhino syntax workflows' || true
          git push