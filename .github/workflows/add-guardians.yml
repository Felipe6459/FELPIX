name: Add FELPIX Guardians
on:
  push:
    paths:
      - '.github/workflows/add-guardians.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.jump .btn{width:112px;height:112px;', '.jump .btn{width:112px;height:112px;')
          s=s.replace('.jump .btn{width:112px;height:112px;border-radius:50%;background:', '.attack .btn{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffb24d,#b74618 60%,#641c0b);box-shadow:0 10px 0 #491406,0 14px 24px #0009,inset 0 3px 6px #ffffff44;font-size:36px}.jump .btn{width:112px;height:112px;border-radius:50%;background:')
          s=s.replace('@media(max-width:380px){.controls{padding:0 14px}', '@media(max-width:380px){.controls{padding:0 10px}')
          s=s.replace('.jump .btn{width:98px;height:98px;font-size:38px}', '.jump .btn{width:94px;height:94px;font-size:36px}.attack .btn{width:88px;height:88px;font-size:32px}')
          s=s.replace('<div id="shield" class="shield hidden">🛡️ PROTEÇÃO</div>', '<div id="shield" class="shield hidden">🛡️ PROTEÇÃO</div><div id="ammo" class="shield hidden" style="top:94px;border-color:#ffb24d">⚔️ ARMAS: <span id="ammoN">0</span></div>')
          s=s.replace('<div class="jump"><button class="btn" id="jump">▲</button></div>', '<div class="jump"><button class="btn" id="jump">▲</button></div><div class="attack"><button class="btn" id="attack">⚔️</button></div>')
          s=s.replace("const sh=document.getElementById('shield');", "const sh=document.getElementById('shield'),ammoBox=document.getElementById('ammo'),ammoN=document.getElementById('ammoN');")
          s=s.replace('let W,H,running=false,last=0,level=1,lives=3,score=0,coins=0,power=false,inv=0,audio=null,music=null,mi=0;', 'let W,H,running=false,last=0,level=1,lives=3,score=0,coins=0,power=false,inv=0,audio=null,music=null,mi=0,ammo=0,weaponCooldown=0,boss=null;')
          s=s.replace('let map,plats=[],items=[],enemies=[],mush;', 'let map,plats=[],items=[],enemies=[],mush,weapons=[];')
          s=s.replace("mush={x:map.mush,y:95,got:false,v:1};LV.textContent=level", "mush={x:map.mush,y:95,got:false,v:1};const wp=level===1?[3650,3800]:level===2?[4350,4550,4700]:[5400,5650,5850];weapons=wp.map(v=>({x:v,y:105,got:false}));const hp=level+3;boss={x:map.goal-170,y:0,w:82,h:82,hp,maxHp:hp,v:level===1?55:level===2?75:95,dir:-1,hitFlash:0,active:false,dead:false};ammo=0;weaponCooldown=0;ammoN.textContent=0;ammoBox.classList.add('hidden');LV.textContent=level")
          s=s.replace("function lose(){if(inv>0)return;", "function attackSound(){beep(180,.09,'sawtooth',.12);setTimeout(()=>beep(280,.07,'square',.09),35)}function bossHit(){beep(130,.13,'square',.13);setTimeout(()=>beep(90,.10,'triangle',.10),55)}function defeatBoss(){boss.dead=true;boss.active=false;score+=1000;S.textContent=score;beep(220,.16,'square',.12);setTimeout(()=>beep(440,.2,'triangle',.12),120);setTimeout(()=>beep(660,.25,'triangle',.12),260)}function attack(){if(!running||weaponCooldown>0||ammo<=0||!boss||boss.dead)return;ammo--;ammoN.textContent=ammo;weaponCooldown=.35;attackSound();if(boss.active&&boss.x<p.x+p.w+260&&boss.x+boss.w>p.x-260){boss.hp-=.5;boss.hitFlash=.15;score+=50;S.textContent=score;bossHit();if(boss.hp<=0)defeatBoss()}}function lose(){if(inv>0)return;")
          s=s.replace("document.getElementById('jump').onpointerdown=e=>{e.preventDefault();if(running&&p.on){p.vy=-720;p.on=false;jump()}};", "document.getElementById('jump').onpointerdown=e=>{e.preventDefault();if(running&&p.on){p.vy=-720;p.on=false;jump()}};document.getElementById('attack').onpointerdown=e=>{e.preventDefault();attack()};")
          s=s.replace("if((e.key==='ArrowUp'||e.key==='w'||e.code==='Space')&&running&&p.on){p.vy=-720;p.on=false;jump()}", "if((e.key==='ArrowUp'||e.key==='w'||e.code==='Space')&&running&&p.on){p.vy=-720;p.on=false;jump()}if(e.key==='x'||e.key==='j')attack()")
          s=s.replace('function update(dt){if(inv>0)', 'function update(dt){if(weaponCooldown>0)weaponCooldown-=dt;if(inv>0)')
          s=s.replace("if(!mush.got){mush.x+=mush.v*50*dt;", "for(const w of weapons){const wy=G()-w.y;if(!w.got&&Math.abs(w.x-(p.x+p.w/2))<36&&Math.abs(wy-(p.y+p.h/2))<40){w.got=true;ammo++;ammoN.textContent=ammo;ammoBox.classList.remove('hidden');score+=150;S.textContent=score;attackSound()}}if(!mush.got){mush.x+=mush.v*50*dt;")
          s=s.replace('}if(p.x>map.goal)next()}', "}if(boss&&!boss.dead&&p.x>map.goal-500){boss.active=true;boss.y=G()-boss.h;boss.x+=boss.dir*boss.v*dt;if(boss.x<map.goal-310)boss.dir=1;if(boss.x>map.goal-45)boss.dir=-1;if(boss.hitFlash>0)boss.hitFlash-=dt;if(hit(p,boss)){if(p.vy>0&&p.y+p.h-boss.y<25){p.vy=-650;boss.hp-=.5;boss.hitFlash=.15;score+=100;S.textContent=score;bossHit();if(boss.hp<=0)defeatBoss()}else if(inv<=0){if(power){power=false;inv=1;p.vy=-420;beep(120,.15,'sawtooth',.10)}else lose()}}if(p.x>map.goal-25&&boss.dead)next()}else if(p.x>map.goal&&boss.dead)next()}")
          s=s.replace('for(const it of items)if(!it.got){', "for(const it of items)if(!it.got){")
          s=s.replace("if(!mush.got){const y=G()-mush.y;", "for(const w of weapons)if(!w.got){const y=G()-w.y;x.fillStyle='#ffb24d';x.fillRect(w.x-12,y-4,24,8);x.fillStyle='#fff3d0';x.fillRect(w.x+4,y-11,4,22);x.fillStyle='#7a3517';x.fillRect(w.x-17,y-5,8,10)}if(!mush.got){const y=G()-mush.y;")
          s=s.replace("for(const e of enemies)if(!e.dead){", "if(boss&&!boss.dead&&boss.active){const by=boss.y;x.fillStyle=boss.hitFlash>0?'#fff':'#35132f';x.beginPath();x.roundRect(boss.x,by,boss.w,boss.h,18);x.fill();x.fillStyle='#ff5964';x.beginPath();x.arc(boss.x+24,by+28,9,0,7);x.arc(boss.x+58,by+28,9,0,7);x.fill();x.fillStyle='#fff';x.fillRect(boss.x+21,by+25,5,5);x.fillRect(boss.x+55,by+25,5,5);x.fillStyle='#111';x.fillRect(boss.x+20,by+52,42,8);x.fillStyle='#111c';x.fillRect(boss.x,by-18,boss.w,9);x.fillStyle='#ff4b55';x.fillRect(boss.x,by-18,boss.w*(boss.hp/boss.maxHp),9);x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText('GUARDIÃO',boss.x+5,by-23)}for(const e of enemies)if(!e.dead){" )
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Implementa Guardiões e combate no FELPIX'
          git push
