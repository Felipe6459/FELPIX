name: Ajuste temporario do FELPIX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('let map,plats=[],items=[],enemies=[],mush,weapons=[];', 'let map,plats=[],items=[],enemies=[],mush,weapons=[],projectiles=[];')
          s=s.replace('ammo=0;weaponCooldown=0;ammoN.textContent=0;', 'ammo=0;weaponCooldown=0;projectiles=[];ammoN.textContent=0;')
          s=re.sub(r'function attack\(\)\{.*?\}function lose', '''function attack(){if(!running||weaponCooldown>0||ammo<=0||!boss||boss.dead)return;ammo--;ammoN.textContent=ammo;weaponCooldown=.35;projectiles.push({x:p.x+p.w,y:p.y+p.h*.45,vx:720,life:1.8});beep(180,.09,'sawtooth',.12)}function lose''', s, count=1, flags=re.S)
          s=s.replace('if(p.y>H+100){lose();return}', 'if(p.y>H+100){power=false;lose();return}')
          marker='for(const e of enemies)if(!e.dead){'
          projectile_update="""for(const q of projectiles){q.x+=q.vx*dt;q.life-=dt;if(q.life<=0)q.dead=true;if(boss&&!boss.dead&&boss.active&&hit({x:q.x,y:q.y,w:24,h:10},{x:boss.x,y:boss.y,w:boss.w,h:boss.h})){boss.hp-=.5;q.dead=true;score+=50;S.textContent=score;boss.hitFlash=.12;beep(320,.07,'square',.12);if(boss.hp<=0){boss.dead=true;boss.active=false;score+=1000;S.textContent=score}}}projectiles=projectiles.filter(q=>!q.dead);"""
          if marker in s and projectile_update not in s:
            s=s.replace(marker, projectile_update+marker, 1)
          draw_marker='for(const e of enemies)if(!e.dead){'
          projectile_draw="""for(const q of projectiles){x.save();x.translate(q.x,q.y);x.rotate(-.15);x.fillStyle='#d8d8df';x.beginPath();x.roundRect(0,0,24,9,4);x.fill();x.fillStyle='#ff9d35';x.beginPath();x.moveTo(0,2);x.lineTo(-13,5);x.lineTo(0,8);x.fill();x.restore()}"""
          # Use the second occurrence, which is in draw(), not update().
          pos=s.find(draw_marker)
          if pos>=0:
            pos2=s.find(draw_marker,pos+1)
            if pos2>=0 and projectile_draw not in s:
              s=s[:pos2]+projectile_draw+s[pos2:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corrige armas visuais e queda sem poder'
          git push