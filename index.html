<head>

<title>FELPIX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131c;color:#fff;font-family:system-ui,sans-serif;touch-action:none;user-select:none}#game{position:relative;width:100%;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;text-shadow:2px 2px #222;pointer-events:none}.badge{background:#111b;border:1px solid #fff4;border-radius:12px;padding:8px 12px}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 22px;pointer-events:none}.pad,.jump,.attack{display:flex;gap:16px;align-items:end}.btn{pointer-events:auto;width:94px;height:94px;border:3px solid #ffffff66;border-radius:50%;background:radial-gradient(circle at 35% 28%,#566174,#18202d 58%,#090d15);box-shadow:0 9px 0 #070a10,0 13px 22px #0009,inset 0 3px 5px #ffffff35;color:#fff;font-size:38px;font-weight:1000;display:grid;place-items:center;touch-action:none;transition:transform .08s,filter .08s}.btn:active{transform:translateY(7px) scale(.95);filter:brightness(1.3)}.attack .btn{width:100px;height:100px;background:radial-gradient(circle at 35% 28%,#ffb24d,#b74618 60%,#641c0b);box-shadow:0 10px 0 #491406,0 14px 24px #0009,inset 0 3px 6px #ffffff44;font-size:36px}.jump .btn{width:112px;height:112px;background:radial-gradient(circle at 35% 28%,#a27cff,#5b35c5 60%,#321b78);box-shadow:0 10px 0 #24115e,0 14px 24px #0009,inset 0 3px 6px #ffffff44;font-size:44px}@media(max-width:380px){.controls{padding:0 10px}.pad,.jump,.attack{gap:10px}.btn{width:86px;height:86px;font-size:34px}.jump .btn{width:94px;height:94px;font-size:36px}.attack .btn{width:88px;height:88px;font-size:32px}}.message{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#24184fcc,#080b12dd 68%),linear-gradient(135deg,#171a2b,#0b0e17)}.panel{text-align:center;background:linear-gradient(160deg,#1f2435f5,#10131ef8);border:2px solid #8b5cf6aa;border-radius:28px;padding:30px 24px;max-width:360px;margin:20px;box-shadow:0 20px 55px #000b,0 0 35px #7c4dff33}.panel h1{margin:0 0 8px;font-size:48px;letter-spacing:3px;text-shadow:0 0 18px #8b5cf688}.panel p{color:#d7dbea}.start{border:2px solid #b89cff;border-radius:18px;padding:15px 30px;background:linear-gradient(135deg,#9b6cff,#5b35c5);color:white;font-weight:1000;font-size:19px;box-shadow:0 7px 0 #321b78,0 12px 22px #0008}.hidden{display:none!important}.shield{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#111c;border:1px solid #ffe36b;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800}
</style></head><body><main id="game"><canvas id="canvas"></canvas><div class="hud"><div class="badge">FELPIX • FASE <span id="level">1</span></div><div class="badge">❤️ <span id="lives">3</span> &nbsp;🪙 <span id="coins">0</span> &nbsp;⭐ <span id="score">0</span></div></div><div id="shield" class="shield hidden">🛡️ PROTEÇÃO</div><div id="ammo" class="shield hidden" style="top:94px;border-color:#ffb24d">⚔️ ARMAS: <span id="ammoN">0</span></div><div id="message" class="message"><section class="panel"><h1>FELPIX</h1><p>Corra, pule, colete moedas e encontre o cogumelo mágico!</p><p style="font-size:12px;color:#9fa8b8;margin:8px 0 0">🪙 = moedas &nbsp; ⭐ = pontos</p><button class="start" id="start" type="button">JOGAR</button></section></div><div class="controls"><div class="pad"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="jump"><button class="btn" id="jump">▲</button></div><div class="attack"><button class="btn" id="attack">⚔️</button></div></div></main>
<script>(()=>{
const c=document.getElementById('canvas'),x=c.getContext('2d'),msg=document.getElementById('message'),start=document.getElementById('start'),L=document.getElementById('lives'),C=document.getElementById('coins'),S=document.getElementById('score'),LV=document.getElementById('level'),sh=document.getElementById('shield'),ammoBox=document.getElementById('ammo'),ammoN=document.getElementById('ammoN');
let W,H,running=false,last=0,level=1,lives=3,score=0,coins=0,power=false,inv=0,audio=null,music=null,mi=0,ammo=0,weaponCooldown=0,boss=null;
const logo=new Image();logo.src='https://i.postimg.cc/FHRZCdpf/1000911686-removebg-preview.png?v=9';const p={x:80,y:0,w:34,h:46,vx:0,vy:0,on:false},keys={l:false,r:false};
const maps={1:{w:4200,goal:4050,sky:'#72c8ff',top:'#72b84f',dirt:'#5a3b25',plat:[[0,0,720,70],[850,0,500,70],[1500,0,620,70],[2280,0,700,70],[3150,0,1050,70],[470,150,150,24],[1030,145,170,24],[1730,160,190,24],[2500,140,190,24],[3440,170,220,24]],coins:[250,520,930,1110,1630,1800,2410,2580,3330,3500],en:[610,1190,1900,2760,3700],mush:700},2:{w:5000,goal:4850,sky:'#f2a45d',top:'#d68b45',dirt:'#543326',plat:[[0,0,520,70],[680,0,440,70],[1300,0,560,70],[2040,0,420,70],[2660,0,520,70],[3380,0,820,70],[4500,0,500,70],[300,145,150,24],[820,190,170,24],[1450,145,180,24],[2180,180,170,24],[2800,140,180,24],[3550,190,190,24],[4180,150,180,24],[4630,210,180,24]],coins:[170,390,760,930,1380,1550,2130,2300,2730,2900,3500,3700,4240,4420,4680,4800],en:[430,970,1560,2350,3050,3740,4580],mush:1200},3:{w:6200,goal:6050,sky:'#6b5bb5',top:'#7fd16b',dirt:'#3f304c',plat:[[0,0,620,70],[1880,0,420,70],[2620,0,500,70],[3320,0,560,70],[4100,0,430,70],[4860,0,1340,70],[610,75,95,22],[750,155,90,22],[900,70,90,22],[1050,165,95,22],[1200,85,90,22],[1350,175,95,22],[1500,95,90,22],[1650,165,100,22],[1780,75,90,22],[2050,145,110,22],[2280,80,110,22],[2500,150,100,22],[2750,90,100,22],[3000,165,105,22],[3220,80,95,22],[3470,145,110,22],[3720,85,100,22],[3960,165,105,22],[4220,90,100,22],[4470,150,105,22],[4660,75,95,22],[5050,155,110,22],[5300,85,100,22],[5550,165,110,22],[5800,95,100,22]],coins:[655,795,945,1095,1245,1395,1545,1695,2100,2330,2550,2800,3050,3520,3770,4010,4270,4520,5100,5350,5600,5850],en:[470,1110,2010,2900,3600,4350,5200,5700],mush:2330}};
let map,plats=[],items=[],enemies=[],mush,weapons=[];function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',()=>{resize();if(!running&&p.on&&plats.length)p.y=top(plats[0])-p.h});resize();function G(){return H-120}function top(q){return G()-q[1]-q[3]}
function build(){map=maps[level];plats=map.plat;items=map.coins.map((v,i)=>({x:v,y:i%2?195:100,got:false}));enemies=map.en.map((v,i)=>({x:v,y:0,w:34,h:30,v:i%2?-1:1,dead:false}));mush={x:map.mush,y:95,got:false,v:1};const wp=level===1?[3650,3800]:level===2?[4350,4550,4700]:[5400,5650,5850];weapons=wp.map(v=>({x:v,y:105,got:false}));const hp=level+3;boss={x:map.goal-170,y:0,w:82,h:82,hp,maxHp:hp,v:level===1?55:level===2?75:95,dir:-1,hitFlash:0,active:false,dead:false};ammo=0;weaponCooldown=0;ammoN.textContent=0;ammoBox.classList.add('hidden');LV.textContent=level}
function spawn(){p.x=80;p.vx=0;p.vy=0;p.on=false;const ground=top(plats[0]);p.y=ground-p.h;p.on=true;inv=3;sh.classList.remove('hidden')}function reset(){level=1;lives=3;score=coins=0;power=false;L.textContent=3;S.textContent=0;C.textContent=0;build();spawn()}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function beep(f,d=.12,t='square',g=.11){if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(g,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function jump(){beep(520,.08);setTimeout(()=>beep(760,.08),55)}function coin(){beep(880,.08,'sine',.11);setTimeout(()=>beep(1320,.10,'sine',.10),55)}function powerup(){[440,660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.11,'triangle',.10),i*70))}function death(){[330,262,196,131].forEach((f,i)=>setTimeout(()=>beep(f,.24,'triangle',.10),i*170))}const song1=[523,659,784,659,587,698,880,698],song2=[196,247,294,370,330,247,220,294];function musicTick(){const a=level===1?song1:song2;beep(a[mi++%a.length],.24,'triangle',.11)}function musicStart(){if(music)clearInterval(music);mi=0;musicTick();music=setInterval(musicTick,190)}function musicStop(){if(music){clearInterval(music);music=null}}function attackSound(){beep(180,.09,'sawtooth',.12);setTimeout(()=>beep(280,.07,'square',.09),35)}function bossHit(){beep(130,.13,'square',.13);setTimeout(()=>beep(90,.10,'triangle',.10),55)}function defeatBoss(){boss.dead=true;boss.active=false;score+=1000;S.textContent=score;beep(220,.16,'square',.12);setTimeout(()=>beep(440,.2,'triangle',.12),120);setTimeout(()=>beep(660,.25,'triangle',.12),260)}
function attack(){if(!running||weaponCooldown>0||ammo<=0||!boss||boss.dead)return;ammo--;ammoN.textContent=ammo;weaponCooldown=.35;attackSound();if(boss.active&&boss.x<p.x+p.w+260&&boss.x+boss.w>p.x-260){boss.hp-=.5;boss.hitFlash=.15;score+=50;S.textContent=score;bossHit();if(boss.hp<=0)defeatBoss()}}
function lose(){if(inv>0)return;death();lives--;L.textContent=lives;if(lives<=0){running=false;musicStop();msg.innerHTML='<section class="panel"><h1>GAME OVER</h1><p>Suas vidas acabaram.<br>Pontuação: <b>'+score+'</b></p><button class="start" id="again">JOGAR NOVAMENTE</button></section>';msg.classList.remove('hidden');document.getElementById('again').onclick=startGame}else{spawn()}}
function next(){if(!boss||!boss.dead)return;if(level<3){level++;score+=1000;S.textContent=score;build();spawn();running=false;msg.innerHTML='<section class="panel"><h1>FASE '+level+'!</h1><p>Prepare-se para o próximo desafio.</p><button class="start" id="go">CONTINUAR</button></section>';msg.classList.remove('hidden');document.getElementById('go').onclick=()=>{msg.classList.add('hidden');running=true;last=performance.now();musicStart();requestAnimationFrame(loop)}}else{running=false;musicStop();msg.innerHTML='<section class="panel"><h1>VOCÊ VENCEU!</h1><p>Você terminou as três fases!<br>Pontuação: <b>'+score+'</b></p><button class="start" id="again">JOGAR NOVAMENTE</button></section>';msg.classList.remove('hidden');document.getElementById('again').onclick=startGame}}
function startGame(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();reset();msg.classList.add('hidden');running=true;last=performance.now();musicStart();draw();requestAnimationFrame(loop)}catch(e){console.error(e);msg.classList.remove('hidden')}}
function update(dt){if(inv>0)inv-=dt;if(weaponCooldown>0)weaponCooldown-=dt;const ac=power?3200:2850,sp=power?560:500;if(keys.l)p.vx-=ac*dt;if(keys.r)p.vx+=ac*dt;p.vx*=Math.pow(.0008,dt);p.vx=Math.max(-sp,Math.min(sp,p.vx));p.vy+=1850*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;let landed=false;for(const q of plats){const ty=top(q);if(p.x+p.w>q[0]&&p.x<q[0]+q[2]&&p.y+p.h>=ty&&p.y+p.h<=ty+34&&p.vy>=0){p.y=ty-p.h;p.vy=0;p.on=true;landed=true}}if(!landed)p.on=false;if(p.y>H+100){lose();return}for(const it of items)if(!it.got&&Math.abs(p.x-it.x)<42&&Math.abs(p.y-(G()-it.y))<65){it.got=true;coins++;score+=100;C.textContent=coins;S.textContent=score;coin()}if(!mush.got&&Math.abs(p.x-mush.x)<48&&Math.abs(p.y-(G()-mush.y))<70){mush.got=true;power=true;score+=500;S.textContent=score;powerup()}for(const w of weapons)if(!w.got&&Math.abs(p.x-w.x)<48&&Math.abs(p.y-(G()-w.y))<70){w.got=true;ammo++;ammoN.textContent=ammo;ammoBox.classList.remove('hidden');beep(720,.1,'triangle',.11)}for(const e of enemies)if(!e.dead){e.x+=e.v*dt*70;if(e.x<0||e.x>map.w)e.v*=-1;if(hit(p,{x:e.x,y:top([e.x,0,e.w,e.h]),w:e.w,h:e.h})){if(p.vy>300){e.dead=true;p.vy=-600;score+=200;S.textContent=score;bossHit()}else lose()}}if(boss&&!boss.dead&&p.x>map.goal-500){boss.active=true;boss.x+=boss.dir*boss.v*dt;if(boss.x<map.goal-300||boss.x>map.goal-80)boss.dir*=-1;if(boss.active&&hit(p,boss)){if(p.vy>250){boss.hp-=.5;p.vy=-650;boss.hitFlash=.15;score+=100;S.textContent=score;bossHit();if(boss.hp<=0)defeatBoss()}else lose()}}if(boss&&boss.dead&&p.x>map.goal-20)next()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle=map?map.sky:'#10131c';x.fillRect(0,0,W,H);if(!map)return;const cam=Math.max(0,Math.min(map.w-W,p.x-W*.35));x.save();x.translate(-cam,0);for(const q of plats){const y=top(q);x.fillStyle=map.dirt;x.fillRect(q[0],y,q[2],q[3]);x.fillStyle=map.top;x.fillRect(q[0],y,q[2],10)}for(const it of items)if(!it.got){x.fillStyle='#ffd84d';x.beginPath();x.arc(it.x,G()-it.y,10,0,Math.PI*2);x.fill()}if(!mush.got){if(logo.complete)x.drawImage(logo,mush.x-20,G()-mush.y-38,40,40)}for(const w of weapons)if(!w.got){x.fillStyle='#ffb24d';x.fillRect(w.x-15,G()-w.y-6,30,8);x.fillStyle='#fff';x.fillRect(w.x-2,G()-w.y-22,4,16)}for(const e of enemies)if(!e.dead){x.fillStyle='#ef5350';x.fillRect(e.x,top([e.x,0,e.w,e.h]),e.w,e.h)}if(boss&&!boss.dead&&boss.active){const by=top([boss.x,0,boss.w,boss.h]);x.fillStyle=boss.hitFlash>0?'#fff':'#9b3cff';x.fillRect(boss.x,by,boss.w,boss.h);x.fillStyle='#111';x.fillRect(boss.x+14,by+20,14,14);x.fillRect(boss.x+54,by+20,14,14);x.fillStyle='#222';x.fillRect(boss.x,by-16,boss.w,8);x.fillStyle='#63e66d';x.fillRect(boss.x,by-16,boss.w*(boss.hp/boss.maxHp),8)}if(logo.complete&&level===1)x.drawImage(logo,map.goal-90,top([map.goal-90,0,60,60])-70,60,60);x.fillStyle='#fff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#222';x.fillRect(p.x+8,p.y+8,6,6);x.fillRect(p.x+22,p.y+8,6,6);x.restore()}
function loop(t){if(!running)return;const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function bindHold(el,prop){el.addEventListener('pointerdown',e=>{e.preventDefault();keys[prop]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[prop]=false}))}bindHold(document.getElementById('left'),'l');bindHold(document.getElementById('right'),'r');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(running&&p.on){p.vy=-700;p.on=false;jump()}});document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});start.addEventListener('pointerdown',e=>{e.preventDefault();startGame()});start.addEventListener('click',e=>{e.preventDefault();startGame()});build();spawn();draw();
})();</script></body></html>
