<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Rush — Night Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%}
.hud{position:absolute;z-index:5;inset:14px 14px auto;display:flex;justify-content:space-between;pointer-events:none}
.badge{padding:8px 12px;border:1px solid #ffffff28;border-radius:14px;background:#080c13b8;backdrop-filter:blur(10px);font-weight:800}
.speed{font-size:30px;line-height:.9;text-align:right}.speed small{display:block;font-size:10px;letter-spacing:.18em;opacity:.65}
.controls{position:absolute;z-index:8;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}.ctrl{width:62px;height:62px;border-radius:50%;border:1px solid #ffffff30;background:#07101dcc;color:#fff;font-size:22px;font-weight:900;box-shadow:0 8px 22px #0008;touch-action:none}
#gas{width:88px;border-radius:18px;font-size:12px;letter-spacing:.08em}
.loading{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#05070b;color:#fff;font-weight:800;letter-spacing:.08em}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<div id="loading" class="loading">CARREGANDO CIDADE 3D…</div>
<div class="hud"><div class="badge">STREET RUSH<br><small style="opacity:.55">NIGHT RUN • PROTOTYPE 01</small></div><div class="speed"><small>KM/H</small><span id="speed">0</span></div></div>
<div class="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl" id="gas">ACELERAR</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const root=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070b);
scene.fog=new THREE.FogExp2(0x0a0e17,0.014);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);
camera.position.set(0,3.1,7.8);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9fb7ff,0x11141a,1.25));
const moon=new THREE.DirectionalLight(0xb8c8ff,2.2);moon.position.set(-30,45,25);moon.castShadow=true;scene.add(moon);

const roadMat=new THREE.MeshStandardMaterial({color:0x25272b,roughness:.82,metalness:.05});
const sidewalkMat=new THREE.MeshStandardMaterial({color:0x555960,roughness:.92});
const lineMat=new THREE.MeshStandardMaterial({color:0xe7e2d0,roughness:.5});
const darkMat=new THREE.MeshStandardMaterial({color:0x101318,roughness:.9});

function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}

const road=box(14,.18,430,roadMat,0,-.08,-190);
box(2,.22,430,sidewalkMat,-8,.02,-190);box(2,.22,430,sidewalkMat,8,.02,-190);
for(let z=8;z>-405;z-=12){
  box(.12,.025,6,lineMat,-2.35,.025,z);
  box(.12,.025,6,lineMat,2.35,.025,z);
}
for(let z=8;z>-405;z-=20){
  box(.16,.025,8,lineMat,-6.85,.025,z);
  box(.16,.025,8,lineMat,6.85,.025,z);
}

const buildingMats=[0x1b2029,0x242a35,0x30343b,0x171b22];
for(let z=4;z>-400;z-=18){
  for(const side of [-1,1]){
    const h=7+Math.random()*18,w=5+Math.random()*7,d=11+Math.random()*6;
    const x=side*(11+Math.random()*4);
    const m=box(w,h,d,new THREE.MeshStandardMaterial({color:buildingMats[Math.floor(Math.random()*buildingMats.length)],roughness:.85}),x,h/2,z+Math.random()*6);
    const windowMat=new THREE.MeshBasicMaterial({color:0xd8c58a});
    for(let yy=3;yy<h-1;yy+=2.8){
      for(let xx=-w*.32;xx<w*.33;xx+=1.7){
        const win=new THREE.Mesh(new THREE.PlaneGeometry(.75,.95),windowMat);
        win.position.set(x+xx,yy,m.position.z-d/2-.01);
        win.rotation.y=side===1?Math.PI:0;
        scene.add(win);
      }
    }
  }
}

function streetLight(x,z){
 const pole=box(.09,5.2,.09,darkMat,x,2.6,z);
 const arm=box(1.0,.08,.08,darkMat,x+(x<0?-.45:.45),5.05,z);
 const glow=new THREE.PointLight(0xffdca3,18,14,2);glow.position.set(x+(x<0?-.9:.9),4.85,z);scene.add(glow);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.09,12,8),new THREE.MeshBasicMaterial({color:0xffe5b2}));
 bulb.position.copy(glow.position);scene.add(bulb);
}
for(let z=3;z>-400;z-=14){streetLight(-7.3,z);streetLight(7.3,z-7)}

let car=new THREE.Group();scene.add(car);
let loaded=false;
const loader=new GLTFLoader();
loader.load('https://threejs.org/examples/models/gltf/ferrari.glb',g=>{
  car=g.scene;
  car.scale.setScalar(1.15);
  car.position.set(0,.02,1.2);
  car.rotation.y=Math.PI;
  car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  scene.add(car);loaded=true;
  document.getElementById('loading').classList.add('hidden');
},undefined,()=>{
  document.getElementById('loading').textContent='NÃO FOI POSSÍVEL CARREGAR O CARRO';
});

let steer=0,gas=false,speed=0,offset=0,last=performance.now();
function bind(id,down,up){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();down()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();up()}))}
bind('left',()=>steer=-1,()=>{if(steer<0)steer=0});
bind('right',()=>steer=1,()=>{if(steer>0)steer=0});
bind('gas',()=>gas=true,()=>gas=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')steer=-1;if(e.key==='ArrowRight')steer=1;if(e.key==='ArrowUp')gas=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'&&steer<0)steer=0;if(e.key==='ArrowRight'&&steer>0)steer=0;if(e.key==='ArrowUp')gas=false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

function animate(now){
 const dt=Math.min((now-last)/1000,.04);last=now;
 speed+=((gas?42:-24)*dt);speed=THREE.MathUtils.clamp(speed,0,145);
 offset+=speed*dt*.018;
 if(loaded){
   car.position.x=THREE.MathUtils.damp(car.position.x,steer*4.6,.12,dt);
   car.position.z=1.2;
   car.rotation.z=THREE.MathUtils.damp(car.rotation.z,-steer*.055,.1,dt);
   car.rotation.y=THREE.MathUtils.damp(car.rotation.y,Math.PI-steer*.035,.1,dt);
   scene.position.z=offset%12;
 }
 camera.position.x=THREE.MathUtils.damp(camera.position.x,car.position.x*.72,.1,dt);
 camera.position.y=THREE.MathUtils.damp(camera.position.y,3.0,.1,dt);
 camera.lookAt(car.position.x*.55,1.0,car.position.z-5);
 document.getElementById('speed').textContent=Math.round(speed);
 renderer.render(scene,camera);requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
