name: Fix Rhino syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate bossPhase declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='// RHINO BOSS STABLE: renderer deliberately simple and isolated\\nconst bossPhase=level;'
          if old not in s:
              raise SystemExit('stable Rhino marker not found')
          s=s.replace(old,'// RHINO BOSS STABLE: renderer deliberately simple and isolated',1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Rhino renderer syntax' || true
          rm -f .github/workflows/fix-rhino-syntax.yml
          git add .github/workflows/fix-rhino-syntax.yml
          git commit -m 'Remove temporary Rhino syntax workflow' || true
          git push