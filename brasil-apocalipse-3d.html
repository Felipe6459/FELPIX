<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brasil em Apocalipse 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%}
.hud{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-weight:800}.box{background:#081019dd;border:1px solid #ffffff33;border-radius:12px;padding:8px 10px}
.controls{position:absolute;z-index:6;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 14px}.group{display:flex;gap:8px}.btn{width:68px;height:68px;border-radius:50%;border:2px solid #ffffff55;background:#172532ee;color:#fff;font-size:25px;font-weight:900}.fire{background:#a82d26}
.screen{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#05090ddd}.panel{width:min(420px,calc(100% - 28px));padding:26px;text-align:center;border:1px solid #ffffff33;border-radius:22px;background:#0c141cf5}.panel h1{margin:0 0 8px;font-size:30px}.panel p{color:#c8d0d6}.go{border:0;border-radius:14px;padding:14px 26px;background:#b9362f;color:#fff;font-size:18px;font-weight:900}
</style></head>
<body><main id="game"><canvas id="c"></canvas>
<div class="hud"><div class="box">🇧🇷 PALMEIRA DOS ÍNDIOS</div><div class="box">❤️ <span id="hp">100</span> &nbsp; 🧟 <span id="kills">0</span></div></div>
<div class="controls"><div class="group"><button class="btn" id="l">◀</button><button class="btn" id="r">▶</button></div><div class="group"><button class="btn" id="u">▲</button><button class="btn" id="d">▼</button><button class="btn fire" id="f">🔫</button></div></div>
<div class="screen" id="menu"><section class="panel"><h1>🇧🇷 Brasil em Apocalipse 3D</h1><p>Você está em Palmeira dos Índios. Explore, desvie dos zumbis e sobreviva.</p><button class="go" id="start">COMEÇAR</button></section></div>
</main>
<script>
(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),menu=document.getElementById('menu'),hpEl=document.getElementById('hp'),killsEl=document.getElementById('kills');
let W=innerWidth,H=innerHeight,last=0,running=false,hp=100,kills=0,invuln=0,shots=[],zombies=[];
const keys={l:0,r:0,u:0,d:0};const p={x:0,z:260,dir:0,speed:210};const world={minX:-850,maxX:850,minZ:-850,maxZ:900};
function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();
function spawn(){zombies=[];for(let i=0;i<8;i++){const side=i%2?-1:1;zombies.push({x:side*(300+i*75),z:-180-i*95,hp:2,hit:0,speed:24+i*2})}}
function start(){running=true;menu.style.display='none';hp=100;kills=0;shots=[];p.x=0;p.z=260;p.dir=0;spawn();hpEl.textContent=100;killsEl.textContent=0;last=performance.now();requestAnimationFrame(loop)}
function project(wx,wz){const camX=p.x,camZ=p.z+420;const dx=wx-camX,dz=wz-camZ;const depth=dz;const side=dx;if(depth<35)return null;const scale=Math.min(W,H)*1.0/depth;return{x:W/2+side*scale,y:H*.62-depth*.045*scale,s:scale,depth}}
function rectWorld(wx,wz,w,d,fill){const o=project(wx,wz);if(!o)return;const ww=o.s*w,hh=o.s*d;ctx.fillStyle=fill;ctx.fillRect(o.x-ww/2,o.y-hh,ww,hh)}
function draw(){ctx.clearRect(0,0,W,H);
const sky=ctx.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#182f3c');sky.addColorStop(1,'#91a4a8');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.58);
ctx.fillStyle='#263128';ctx.fillRect(0,H*.58,W,H*.42);
for(let gx=-900;gx<=900;gx+=120){const a=project(gx,-900),b=project(gx,900);if(a&&b){ctx.strokeStyle='#3d4a40';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
for(let gz=-800;gz<=800;gz+=120){const a=project(-900,gz),b=project(900,gz);if(a&&b){ctx.strokeStyle='#3a463d';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
for(let i=-6;i<=6;i++){rectWorld(i*220,-480,150,150,i%2?'#554b45':'#4b5759');rectWorld(i*220,-720,190,190,i%2?'#4b5558':'#5a5048')}
zombies.slice().sort((a,b)=>b.z-a.z).forEach(q=>{const o=project(q.x,q.z);if(!o)return;const w=o.s*38,h=o.s*78;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(o.x,o.y+4,w*.75,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=q.hp===1?'#78966d':'#55715d';ctx.fillRect(o.x-w/2,o.y-h*.62,w,h*.62);ctx.beginPath();ctx.arc(o.x,o.y-h*.72,w*.55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8473e';ctx.fillRect(o.x-w*.25,o.y-h*.77,w*.12,w*.12);ctx.fillRect(o.x+w*.13,o.y-h*.77,w*.12,w*.12)});
const po={x:W/2,y:H*.76,s:Math.min(W,H)/420};{const w=po.s*48,h=po.s*112;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(po.x,po.y+7,w*.8,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#29445a';ctx.fillRect(po.x-w/2,po.y-h*.62,w,h*.62);ctx.fillStyle='#c8916c';ctx.beginPath();ctx.arc(po.x,po.y-h*.76,w*.42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#15191d';ctx.fillRect(po.x-w*.42,po.y-h*.95,w*.84,h*.17);ctx.strokeStyle='#d9dfe2';ctx.lineWidth=Math.max(2,po.s*7);ctx.beginPath();ctx.moveTo(po.x+w*.18,po.y-h*.42);ctx.lineTo(po.x+w*.7,po.y-h*.3);ctx.stroke();}
shots.forEach(b=>{const o=project(b.x,b.z);if(o){ctx.fillStyle='#ffd35a';ctx.beginPath();ctx.arc(o.x,o.y,Math.max(2,o.s*5),0,Math.PI*2);ctx.fill()}})
}
function update(dt){let x=(keys.r?1:0)-(keys.l?1:0),z=(keys.d?1:0)-(keys.u?1:0);if(x||z){const n=Math.hypot(x,z);x/=n;z/=n;p.x+=x*p.speed*dt;p.z+=z*p.speed*dt;if(Math.abs(x)>.1)p.dir=x>0?Math.PI/2:-Math.PI/2}p.x=Math.max(world.minX,Math.min(world.maxX,p.x));p.z=Math.max(world.minZ,Math.min(world.maxZ,p.z));invuln=Math.max(0,invuln-dt);
zombies.forEach(q=>{const dx=p.x-q.x,dz=p.z-q.z,dist=Math.hypot(dx,dz);if(dist>55){q.x+=dx/dist*q.speed*dt;q.z+=dz/dist*q.speed*dt}else if(invuln<=0){hp-=10;invuln=.8}});
shots.forEach(b=>{b.life-=dt;b.x+=b.vx*dt;b.z+=b.vz*dt;zombies.forEach(q=>{if(q.hp>0&&Math.hypot(b.x-q.x,b.z-q.z)<45){q.hp--;b.life=0;if(q.hp<=0){kills++;killsEl.textContent=kills}}})});shots=shots.filter(b=>b.life>0);zombies=zombies.filter(q=>q.hp>0);if(zombies.length<4)for(let i=0;i<4;i++)zombies.push({x:(Math.random()>.5?1:-1)*(500+Math.random()*300),z:-600-Math.random()*250,hp:2,speed:25,hit:0});if(hp<=0){hp=100;spawn()}hpEl.textContent=Math.max(0,Math.ceil(hp))}
function shoot(){if(!running)return;const a=p.dir;shots.push({x:p.x+Math.sin(a)*35,z:p.z+Math.cos(a)*35,vx:Math.sin(a)*700,vz:Math.cos(a)*700,life:1})}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function bind(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))}
bind('l','l');bind('r','r');bind('u','u');bind('d','d');document.getElementById('f').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;if(e.key==='ArrowRight'||e.key==='d')keys.r=1;if(e.key==='ArrowUp'||e.key==='w')keys.u=1;if(e.key==='ArrowDown'||e.key==='s')keys.d=1;if(e.code==='Space')shoot()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0;if(e.key==='ArrowUp'||e.key==='w')keys.u=0;if(e.key==='ArrowDown'||e.key==='s')keys.d=0});
document.getElementById('start').addEventListener('click',start);
})();
</script></body></html>
