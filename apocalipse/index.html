<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brasil em Apocalipse</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c11;color:#fff;font-family:system-ui,sans-serif;touch-action:none;user-select:none}#game{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%}.hud{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.badge{background:#10151ddd;border:1px solid #ffffff24;border-radius:12px;padding:7px 10px;font-weight:800}.bar{position:absolute;z-index:5;left:50%;top:58px;transform:translateX(-50%);width:min(330px,55vw);height:12px;background:#111b;border:1px solid #fff3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#e34b4b}.mission{position:absolute;z-index:5;left:12px;top:58px;background:#10151dcc;border:1px solid #fff2;border-radius:10px;padding:7px 10px;font-size:12px;max-width:48vw}.controls{position:absolute;z-index:6;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 16px}.pad,.actions{display:flex;gap:10px}.btn{width:70px;height:70px;border-radius:50%;border:2px solid #ffffff38;background:#202735e8;color:#fff;font-size:28px;font-weight:900;box-shadow:0 6px 0 #080a0e;touch-action:none}.btn:active{transform:translateY(4px)}.fire{background:#a43a2e}.reload{background:#3f648e}.message{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#273747e8,#05070be8 72%)}.panel{max-width:410px;margin:18px;padding:28px 24px;text-align:center;background:linear-gradient(160deg,#18202bf5,#0d1118f5);border:1px solid #d14a40aa;border-radius:24px;box-shadow:0 22px 70px #000c}.panel h1{margin:0 0 8px;font-size:34px}.panel p{color:#d2d8e1;line-height:1.45}.start{border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,#df5548,#8c241e);color:#fff;font-weight:1000;font-size:18px}.small{font-size:12px;color:#98a4b4}.hidden{display:none!important}</style></head><body><main id="game"><canvas id="canvas"></canvas><div class="hud"><div class="badge">🇧🇷 <span id="city">MACEIÓ</span> • FASE <span id="phase">1</span></div><div class="badge">❤️ <span id="life">100</span> &nbsp; 🔫 <span id="ammo">12</span> &nbsp; ☠️ <span id="kills">0</span> &nbsp; 🪙 <span id="money">0</span></div></div><div class="bar"><i id="hpbar"></i></div><div id="mission" class="mission">Objetivo: elimine os infectados</div><div class="controls"><div class="pad"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button><button class="btn" id="up">▲</button><button class="btn" id="down">▼</button></div><div class="actions"><button class="btn reload" id="reload">↻</button><button class="btn fire" id="fire">🔫</button></div></div><div id="message" class="message"><section class="panel"><h1>🇧🇷 BRASIL EM APOCALIPSE</h1><p>Uma jornada por cidades brasileiras tomadas pelos infectados.</p><p class="small">Fase 1 • Maceió</p><button class="start" id="start">COMEÇAR</button></section></div></main><script>(()=>{const c=document.getElementById('canvas'),x=c.getContext('2d'),msg=document.getElementById('message'),start=document.getElementById('start'),city=document.getElementById('city'),phaseEl=document.getElementById('phase'),lifeEl=document.getElementById('life'),ammoEl=document.getElementById('ammo'),killsEl=document.getElementById('kills'),moneyEl=document.getElementById('money'),hpbar=document.getElementById('hpbar'),mission=document.getElementById('mission');let W=innerWidth,H=innerHeight;function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();const cities=['MACEIÓ','RECIFE','SALVADOR','SÃO PAULO','RIO DE JANEIRO','BRASÍLIA','MANAUS','BELO HORIZONTE','FORTALEZA','PALMEIRA DOS ÍNDIOS'];const colors=[['#303b42','#46545a'],['#35444a','#56645f'],['#263b42','#425b59'],['#252b32','#424950'],['#3a3031','#554b4a'],['#34383c','#4e5458'],['#253d38','#3e5a49'],['#33383d','#555d61'],['#3d3430','#5c5049'],['#40372e','#5b4d3c']];let phase=1,life=100,money=0,kills=0,ammo=12,mag=12,running=false,last=0,spawnTimer=0,fireTimer=0,reloadTimer=0,wave=1,shots=[],zombies=[],pickups=[],particles=[],obstacles=[],boss=null,cam={x:0,y:0},keys={l:false,r:false,u:false,d:false},mouse={x:0,y:0,active:false},player={x:180,y:950,r:18,speed:230,angle:0,inv:0};const map={w:4200,h:1900};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function hud(){city.textContent=cities[phase-1];phaseEl.textContent=phase;lifeEl.textContent=Math.ceil(life);ammoEl.textContent=reloadTimer>0?'↻':ammo;killsEl.textContent=kills;moneyEl.textContent=money;hpbar.style.width=clamp(life,0,100)+'%';mission.textContent=boss?'Objetivo: derrote o guardião e alcance a saída':`Objetivo: elimine ${wave*8} infectados • ${kills%(wave*8)}/${wave*8}`}function circleRect(px,py,r,o){const nx=clamp(px,o.x,o.x+o.w),ny=clamp(py,o.y,o.y+o.h);return Math.hypot(px-nx,py-ny)<r}function blocked(px,py,r){return obstacles.some(o=>circleRect(px,py,r,o))}function move(e,dx,dy){const nx=e.x+dx,ny=e.y+dy;if(!blocked(nx,e.y,e.r))e.x=clamp(nx,e.r,map.w-e.r);if(!blocked(e.x,ny,e.r))e.y=clamp(ny,e.r,map.h-e.r)}function build(){obstacles=[];for(let xx=110;xx<map.w-250;xx+=360)for(let yy=100;yy<map.h-190;yy+=300)if(Math.random()>.16)obstacles.push({x:xx+Math.random()*28,y:yy+Math.random()*28,w:190,h:125,t:'b'});for(let xx=0;xx<map.w;xx+=520)obstacles.push({x:xx,y:0,w:55,h:map.h,t:'r'});for(let yy=0;yy<map.h;yy+=430)obstacles.push({x:0,y:yy,w:map.w,h:55,t:'r'});for(let i=0;i<20;i++)obstacles.push({x:250+Math.random()*(map.w-500),y:120+Math.random()*(map.h-240),w:58,h:34,t:'c'});pickups=[];for(let i=0;i<9;i++)pickups.push({x:350+i*430,y:250+(i%4)*390,type:i%3?'ammo':'med',got:false})}function reset(){phase=1;life=100;money=0;kills=0;ammo=12;wave=1;shots=[];zombies=[];particles=[];boss=null;reloadTimer=0;fireTimer=0;spawnTimer=0;player={x:180,y:map.h/2,r:18,speed:230,angle:0,inv:0};build();hud()}function shoot(){if(!running||reloadTimer>0||fireTimer>0)return;if(ammo<=0){reload();return}ammo--;fireTimer=.16;const dx=Math.cos(player.angle),dy=Math.sin(player.angle);shots.push({x:player.x+dx*24,y:player.y+dy*24,vx:dx*760,vy:dy*760,life:1.1});hud()}function reload(){if(running&&reloadTimer<=0&&ammo<mag)reloadTimer=1.05}function spawn(){const s=Math.floor(Math.random()*4);let zx=s<2?(s?cam.x+W+50:cam.x-50):cam.x+Math.random()*W,zy=s>=2?(s===2?cam.y-50:cam.y+H+50):cam.y+Math.random()*H;zx=clamp(zx,40,map.w-40);zy=clamp(zy,40,map.h-40);const q=Math.random(),kind=q<.12?'bruto':q<.3?'corredor':'comum';zombies.push({x:zx,y:zy,r:kind==='bruto'?25:17,hp:kind==='bruto'?5+Math.floor(phase/2):kind==='corredor'?1:2,speed:kind==='bruto'?38:kind==='corredor'?105:58,kind,hit:0})}function gameOver(){running=false;msg.classList.remove('hidden');msg.innerHTML=`<section class="panel"><h1>VOCÊ FOI DERROTADO</h1><p>${cities[phase-1]} caiu.</p><p class="small">Abates: ${kills} • Dinheiro: R$ ${money}</p><button class="start" id="again">TENTAR NOVAMENTE</button></section>`;document.getElementById('again').onclick=startGame}function hurt(n){if(player.inv>0)return;life-=n;player.inv=.55;hud();if(life<=0)gameOver()}function bossCreate(){boss={x:map.w-320,y:map.h/2,r:70,hp:30+phase*7,maxHp:30+phase*7,speed:45,hit:0};hud()}function next(){if(phase===10){running=false;msg.classList.remove('hidden');msg.innerHTML='<section class="panel"><h1>🏆 BRASIL SOBREVIVEU!</h1><p>Você chegou a Palmeira dos Índios e completou a campanha.</p><button class="start" id="again">JOGAR NOVAMENTE</button></section>';document.getElementById('again').onclick=startGame;return}phase++;wave=1;kills=0;life=Math.min(100,life+35);ammo=mag;shots=[];zombies=[];boss=null;player.x=180;player.y=map.h/2;build();hud();running=false;msg.classList.remove('hidden');msg.innerHTML=`<section class="panel"><h1>🏙️ ${cities[phase-1]}</h1><p>Nova cidade, novos perigos.</p><p class="small">Fase ${phase} de 10</p><button class="start" id="go">CONTINUAR</button></section>`;document.getElementById('go').onclick=()=>{msg.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}}function startGame(){reset();msg.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}function update(dt){if(!running)return;player.inv=Math.max(0,player.inv-dt);fireTimer=Math.max(0,fireTimer-dt);if(reloadTimer>0){reloadTimer-=dt;if(reloadTimer<=0)ammo=mag;hud()}let dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);if(dx||dy){const n=Math.hypot(dx,dy);move(player,dx/n*player.speed*dt,dy/n*player.speed*dt);player.angle=Math.atan2(dy,dx)}else if(mouse.active)player.angle=Math.atan2(mouse.y-(player.y-cam.y),mouse.x-(player.x-cam.x));spawnTimer-=dt;if(!boss&&spawnTimer<=0){spawnTimer=Math.max(.28,.9-wave*.03);spawn()}if(!boss&&wave>=8)bossCreate();for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(const z of zombies)if(!z.dead&&dist(s,z)<z.r+6){z.hp--;z.hit=.08;s.life=0;if(z.hp<=0){z.dead=true;kills++;money+=z.kind==='bruto'?20:5;for(let i=0;i<6;i++)particles.push({x:z.x,y:z.y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.5});hud()}}if(boss&&!boss.dead&&dist(s,boss)<boss.r+6){boss.hp--;boss.hit=.08;s.life=0;if(boss.hp<=0){boss.dead=true;money+=200;kills++;hud()}}}shots=shots.filter(s=>s.life>0&&s.x>0&&s.x<map.w&&s.y>0&&s.y<map.h);zombies=zombies.filter(z=>!z.dead);for(const z of zombies){const a=Math.atan2(player.y-z.y,player.x-z.x),ox=z.x,oy=z.y;move(z,Math.cos(a)*z.speed*dt,Math.sin(a)*z.speed*dt);if(Math.abs(z.x-ox)<.01&&Math.abs(z.y-oy)<.01)move(z,Math.cos(a+1.57)*z.speed*dt*.7,Math.sin(a+1.57)*z.speed*dt*.7);if(dist(player,z)<player.r+z.r)hurt(z.kind==='bruto'?20:8)}if(boss&&!boss.dead){const a=Math.atan2(player.y-boss.y,player.x-boss.x);move(boss,Math.cos(a)*boss.speed*dt,Math.sin(a)*boss.speed*dt);if(dist(player,boss)<player.r+boss.r-8)hurt(22*dt);boss.hit=Math.max(0,boss.hit-dt)}if(!boss&&kills>=wave*8){wave++;hud()}if(boss&&boss.dead&&player.x>map.w-170)next();for(const q of pickups)if(!q.got&&dist(player,q)<32){q.got=true;if(q.type==='med')life=Math.min(100,life+30);else ammo=Math.min(mag,ammo+8);hud()}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);cam.x=clamp(player.x-W*.42,0,map.w-W);cam.y=clamp(player.y-H*.47,0,map.h-H)}function draw(){x.clearRect(0,0,W,H);const t=colors[phase-1];x.save();x.translate(-cam.x,-cam.y);x.fillStyle=t[0];x.fillRect(0,0,map.w,map.h);for(let gx=0;gx<map.w;gx+=240)for(let gy=0;gy<map.h;gy+=180){x.fillStyle=((gx/240+gy/180)%2)?'#313a3d':'#2b3337';x.fillRect(gx+5,gy+5,230,170)}for(const o of obstacles){if(o.t==='b'){x.fillStyle=t[1];x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#20272b';for(let a=o.x+18;a<o.x+o.w-12;a+=36)for(let b=o.y+18;b<o.y+o.h-20;b+=35)x.fillRect(a,b,17,18);x.fillStyle='#171b1e';x.fillRect(o.x+72,o.y+85,45,40)}else if(o.t==='r'){x.fillStyle='#51585b';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#d5b64d';if(o.w<o.h)for(let b=o.y+15;b<o.y+o.h;b+=42)x.fillRect(o.x+18,b,8,24);else for(let a=o.x+15;a<o.x+o.w;a+=42)x.fillRect(a,o.y+18,24,8)}else{x.fillStyle='#252e34';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#a33a31';x.fillRect(o.x+6,o.y+6,o.w-12,7)}}for(const q of pickups)if(!q.got){x.fillStyle=q.type==='med'?'#63c980':'#e1a23e';x.beginPath();x.arc(q.x,q.y,13,0,7);x.fill();x.fillStyle='#fff';x.font='bold 15px system-ui';x.textAlign='center';x.fillText(q.type==='med'?'+':'A',q.x,q.y+5);x.textAlign='start'}for(const z of zombies){x.save();x.translate(z.x,z.y);x.fillStyle=z.hit?'#fff':z.kind==='bruto'?'#8b4b44':z.kind==='corredor'?'#557d56':'#668f62';x.beginPath();x.arc(0,0,z.r,0,7);x.fill();x.fillStyle='#29372c';x.fillRect(-z.r*.7,5,z.r*1.4,8);x.fillStyle='#df4b4b';x.fillRect(-7,-6,4,4);x.fillRect(3,-6,4,4);x.restore()}if(boss&&!boss.dead){x.save();x.translate(boss.x,boss.y);x.fillStyle=boss.hit?'#fff':'#7b4039';x.beginPath();x.arc(0,0,boss.r,0,7);x.fill();x.fillStyle='#292020';x.fillRect(-38,-5,76,55);x.fillStyle='#d8d8d8';x.beginPath();x.moveTo(-40,-35);x.lineTo(-12,-72);x.lineTo(-3,-32);x.lineTo(20,-68);x.lineTo(38,-31);x.closePath();x.fill();x.restore()}for(const s of shots){x.fillStyle='#ffd36b';x.beginPath();x.arc(s.x,s.y,4,0,7);x.fill()}for(const p of particles){x.globalAlpha=Math.max(0,p.life*2);x.fillStyle='#b9df91';x.fillRect(p.x,p.y,4,4);x.globalAlpha=1}x.save();x.translate(player.x,player.y);x.rotate(player.angle);x.globalAlpha=player.inv&&Math.floor(player.inv*14)%2===0?.45:1;x.fillStyle='#d7ad85';x.beginPath();x.arc(0,0,18,0,7);x.fill();x.fillStyle='#3e72b9';x.fillRect(-13,-13,25,27);x.fillStyle='#273443';x.fillRect(6,-4,28,8);x.restore();x.globalAlpha=1;x.fillStyle='#d5bd65';x.fillRect(map.w-100,map.h/2-75,12,150);x.fillStyle='#d74242';x.beginPath();x.moveTo(map.w-88,map.h/2-68);x.lineTo(map.w-25,map.h/2-44);x.lineTo(map.w-88,map.h/2-20);x.closePath();x.fill();x.restore();if(boss&&!boss.dead){x.fillStyle='#10151ddd';x.fillRect(W/2-150,78,300,25);x.fillStyle='#c94149';x.fillRect(W/2-146,82,292*Math.max(0,boss.hp/boss.maxHp),17);x.fillStyle='#fff';x.font='800 12px system-ui';x.textAlign='center';x.fillText('GUARDIÃO • '+cities[phase-1],W/2,95);x.textAlign='start'}}function loop(t){if(!running)return;const dt=Math.min(.04,Math.max(0,(t-last)/1000));last=t;update(dt);draw();requestAnimationFrame(loop)}function hold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true},{passive:false});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false},{passive:false}))}hold('left','l');hold('right','r');hold('up','u');hold('down','d');document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()},{passive:false});document.getElementById('reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()},{passive:false});c.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});c.addEventListener('pointerdown',e=>{if(e.clientY<H-120)shoot()});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.l=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.r=true;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')keys.u=true;if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')keys.d=true;if(e.key===' ')shoot();if(e.key.toLowerCase()==='r')reload()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.l=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.r=false;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')keys.u=false;if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')keys.d=false});start.onclick=startGame;reset();draw()})();</script></body></html>
