<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FELPIX • Cobrinha</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100a;color:#fff;font-family:system-ui,sans-serif;touch-action:none;user-select:none}#app{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:760px;margin:auto;padding:10px;gap:8px}.hud{display:flex;justify-content:space-between;gap:7px;font-weight:900}.box{background:#101d15e8;border:1px solid #6ee7a044;border-radius:14px;padding:8px 10px;font-size:14px}#boardWrap{min-height:0;display:grid;place-items:center}canvas{display:block;border:2px solid #4ade8066;border-radius:18px;background:#08130c;box-shadow:0 12px 40px #0009}#controls{display:grid;grid-template-columns:repeat(3,clamp(82px,25vw,108px));grid-template-rows:repeat(2,clamp(82px,25vw,108px));gap:15px 18px;justify-content:center;padding:3px 0 6px}.btn{width:100%;height:100%;border:3px solid #ffffff55;border-radius:24px;background:radial-gradient(circle at 35% 25%,#41684d,#172a1d 62%,#09100c);color:#fff;font-size:clamp(36px,11vw,52px);font-weight:1000;box-shadow:0 7px 0 #050906,0 10px 22px #0009,inset 0 3px 5px #ffffff18;touch-action:none}.btn:active{transform:translateY(5px) scale(.95);filter:brightness(1.3)}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}#tip{text-align:center;color:#93a69a;font-size:11px}.screen{position:absolute;inset:0;display:grid;place-items:center;background:#020704dd;z-index:10;padding:20px}.panel{width:min(400px,100%);text-align:center;padding:28px 22px;border:1px solid #4ade8066;border-radius:24px;background:linear-gradient(160deg,#132218f7,#08100bf7);box-shadow:0 20px 60px #000b}.panel h1{font-size:42px;margin:0 0 6px}.panel p{color:#bfd1c4;margin:8px 0 20px}.start{border:0;border-radius:15px;padding:16px 34px;background:linear-gradient(135deg,#4ade80,#15803d);color:#041007;font-size:20px;font-weight:1000;min-width:180px;min-height:56px;cursor:pointer;touch-action:manipulation}.hidden{display:none!important}</style></head><body><main id="app"><div class="hud"><div class="box">🐍 FELPIX</div><div class="box">⭐ <span id="score">0</span> &nbsp;🏆 <span id="best">0</span></div></div><div id="boardWrap"><canvas id="board"></canvas></div><div><div id="controls"><button class="btn up" data-dir="up">▲</button><button class="btn left" data-dir="left">◀</button><button class="btn down" data-dir="down">▼</button><button class="btn right" data-dir="right">▶</button></div><div id="tip">Coma frutas, pegue poderes e desvie dos obstáculos.</div></div></main><div class="screen" id="screen"><section class="panel"><h1>🐍 COBRINHA</h1><p>Uma versão evoluída do FELPIX. Cresça, pegue poderes e sobreviva o máximo possível.</p><button class="start" id="start" type="button">JOGAR</button></section></div><script>(()=>{const c=document.getElementById('board'),x=c.getContext('2d'),screen=document.getElementById('screen'),start=document.getElementById('start'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),N=20;let cell=20,score=0,best=0,snake=[],food={},bonus=null,obstacles=[],dir={x:1,y:0},next={x:1,y:0},running=false,last=0,timer=0,raf=0,shield=0,boost=0,magnet=0,level=1;try{best=Number(localStorage.getItem('felpixSnakeBest')||0)}catch(e){}bestEl.textContent=best;function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};next={x:1,y:0};score=0;level=1;shield=boost=magnet=0;scoreEl.textContent=0;obstacles=[];bonus=null;placeFood()}function freeCell(){let p,tries=0;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};tries++}while(tries<500&&(snake.some(s=>s.x===p.x&&s.y===p.y)||obstacles.some(o=>o.x===p.x&&o.y===p.y)||food.x===p.x&&food.y===p.y));return p}function placeFood(){food=freeCell()}function makeObstacles(){obstacles=[];const count=Math.min(10,Math.floor(score/4));for(let i=0;i<count;i++)obstacles.push(freeCell())}function setDir(d){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}},v=m[d];if(!v||!running)return;if(v.x===-dir.x&&v.y===-dir.y)return;next=v}function speed(){return Math.max(58,126-score*2-(boost>0?25:0))}function spawnBonus(){const p=freeCell();const types=['shield','boost','magnet'];bonus={...p,type:types[Math.floor(Math.random()*types.length)],life:10}}function applyBonus(){if(!bonus)return;if(bonus.type==='shield')shield=8;if(bonus.type==='boost')boost=8;if(bonus.type==='magnet')magnet=8;bonus=null}function step(){dir=next;let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=N||head.y<0||head.y>=N){if(shield>0){shield=0;head={x:(head.x+N)%N,y:(head.y+N)%N}}else return gameOver()}if(obstacles.some(o=>o.x===head.x&&o.y===head.y)){if(shield>0){shield=0;head={x:Math.max(0,Math.min(N-1,head.x-dir.x)),y:Math.max(0,Math.min(N-1,head.y-dir.y))}}else return gameOver()}const eating=head.x===food.x&&head.y===food.y;const body=eating?snake:snake.slice(0,-1);if(body.some(s=>s.x===head.x&&s.y===head.y))return gameOver();snake.unshift(head);if(eating){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('felpixSnakeBest',String(best))}catch(e){}}if(score%5===0){level++;makeObstacles()}if(score%3===0&&!bonus)spawnBonus();placeFood()}else snake.pop();if(bonus&&head.x===bonus.x&&head.y===bonus.y)applyBonus()}function gameOver(){running=false;showScreen('<h1>💥 FIM!</h1><p>Pontuação: <b>'+score+'</b><br>Recorde: <b>'+best+'</b><br>Tamanho: <b>'+snake.length+'</b></p><button class="start" id="again" type="button">JOGAR NOVAMENTE</button>');document.getElementById('again').addEventListener('pointerup',startGame,{once:true});document.getElementById('again').addEventListener('click',startGame,{once:true})}function showScreen(html){screen.innerHTML='<section class="panel">'+html+'</section>';screen.classList.remove('hidden')}function startGame(e){if(e){e.preventDefault();e.stopPropagation()}if(running)return;reset();running=true;screen.classList.add('hidden');last=performance.now();timer=0;if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function loop(t){if(!running){raf=0;return}const dt=Math.min(.1,(t-last)/1000);last=t;timer+=dt*1000;shield=Math.max(0,shield-dt);boost=Math.max(0,boost-dt);magnet=Math.max(0,magnet-dt);if(bonus){bonus.life-=dt;if(bonus.life<=0)bonus=null}if(timer>=speed()){timer=0;step()}draw();raf=requestAnimationFrame(loop)}function safeRound(px,py,w,h,r){if(x.roundRect){x.roundRect(px,py,w,h,r)}else{x.rect(px,py,w,h)}}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#08130c';x.fillRect(0,0,c.width,c.height);for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){x.fillStyle=(xx+y)%2?'#0b180f':'#0d1b11';x.fillRect(xx*cell,y*cell,cell,cell)}obstacles.forEach(o=>{x.fillStyle='#475569';x.beginPath();safeRound(o.x*cell+2,o.y*cell+2,cell-4,cell-4,5);x.fill()});const fx=food.x*cell+cell/2,fy=food.y*cell+cell/2;x.fillStyle='#ef4444';x.beginPath();x.arc(fx,fy,cell*.32,0,Math.PI*2);x.fill();x.fillStyle='#4ade80';x.fillRect(food.x*cell+cell*.45,food.y*cell+cell*.06,cell*.11,cell*.22);if(bonus){const bx=bonus.x*cell+cell/2,by=bonus.y*cell+cell/2;x.fillStyle=bonus.type==='shield'?'#60a5fa':bonus.type==='boost'?'#facc15':'#c084fc';x.beginPath();x.arc(bx,by,cell*.36,0,Math.PI*2);x.fill();x.fillStyle='#08130c';x.font=(cell*.45)+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(bonus.type==='shield'?'🛡️':bonus.type==='boost'?'⚡':'🧲',bx,by)}snake.forEach((s,i)=>{const pad=i?2.3:1.2,px=s.x*cell+pad,py=s.y*cell+pad,sz=cell-pad*2;x.fillStyle=i?'#22c55e':'#bbf7d0';x.beginPath();safeRound(px,py,sz,sz,cell*.2);x.fill();if(i===0){x.fillStyle='#052e16';const ex=px+sz*(dir.x<0?.3:dir.x>0?.7:.3),ey=py+sz*(dir.y>0?.7:.3);x.beginPath();x.arc(ex,ey,Math.max(2,cell*.075),0,Math.PI*2);x.fill()}})}function resize(){const max=Math.min(innerWidth-24,innerHeight-265,620);cell=Math.max(12,Math.floor(max/N));c.width=cell*N;c.height=cell*N;draw()}document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.dir)}));addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k){e.preventDefault();setDir(k)}if((e.key===' '||e.key==='Enter')&&!running)startGame(e)});start.addEventListener('pointerup',startGame);start.addEventListener('click',startGame);start.addEventListener('touchend',startGame,{passive:false});addEventListener('resize',resize);reset();resize();draw()})()</script></body></html>
