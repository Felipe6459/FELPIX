<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Brasil em Apocalipse V4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:system-ui,sans-serif;touch-action:none;user-select:none}#g{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%}.hud{position:absolute;z-index:4;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.b{background:#0b1017e8;border:1px solid #ffffff22;border-radius:12px;padding:7px 10px;font-weight:900}.m{position:absolute;z-index:4;left:10px;top:58px;background:#0b1017dd;border:1px solid #ffffff22;border-radius:10px;padding:7px 10px;font-size:12px}.hp{position:absolute;z-index:4;left:50%;top:58px;transform:translateX(-50%);width:min(320px,46vw);height:11px;background:#111b;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;background:#d84a45}.controls{position:absolute;z-index:5;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 14px}.set{display:flex;gap:8px}.btn{width:68px;height:68px;border-radius:50%;border:2px solid #ffffff35;background:#202a36ee;color:#fff;font-size:26px;font-weight:900;box-shadow:0 6px 0 #07090c}.fire{background:#a9342d}.reload{background:#355c84}.screen{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#33434ee8,#05070be8 72%)}.panel{max-width:420px;margin:18px;padding:28px 24px;text-align:center;background:linear-gradient(160deg,#18212bf7,#0b1017f7);border:1px solid #d14a40aa;border-radius:24px;box-shadow:0 22px 70px #000c}.panel h1{margin:0 0 8px;font-size:34px}.panel p{color:#d3dae2;line-height:1.45}.go{border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,#df5548,#8b241e);color:#fff;font-weight:1000;font-size:18px}.small{font-size:12px;color:#98a4b4}.hide{display:none!important}</style></head><body><main id="g"><canvas id="c"></canvas><div class="hud"><div class="b">🇧🇷 <span id="city">MACEIÓ</span> • FASE <span id="ph">1</span></div><div class="b">❤️ <span id="life">100</span> 🔫 <span id="ammo">12</span> ☠️ <span id="kill">0</span> 🪙 <span id="cash">0</span></div></div><div class="hp"><i id="bar"></i></div><div class="m" id="mission">Sobreviva à onda de infectados</div><div class="controls"><div class="set"><button class="btn" id="l">◀</button><button class="btn" id="r">▶</button><button class="btn" id="u">▲</button><button class="btn" id="d">▼</button></div><div class="set"><button class="btn reload" id="re">↻</button><button class="btn fire" id="fi">🔫</button></div></div><div class="screen" id="screen"><section class="panel"><h1>🇧🇷 BRASIL EM APOCALIPSE</h1><p>V4 • Sobreviva pelas cidades brasileiras.</p><p class="small">Personagens detalhados • ondas • itens • chefões</p><button class="go" id="go">COMEÇAR</button></section></div></main><script>(()=>{const c=document.getElementById('c'),q=c.getContext('2d'),screen=document.getElementById('screen'),go=document.getElementById('go'),city=document.getElementById('city'),ph=document.getElementById('ph'),lifeEl=document.getElementById('life'),ammoEl=document.getElementById('ammo'),killEl=document.getElementById('kill'),cash=document.getElementById('cash'),bar=document.getElementById('bar'),mission=document.getElementById('mission');let W=innerWidth,H=innerHeight;function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',size);size();const cities=['MACEIÓ','RECIFE','SALVADOR','SÃO PAULO','RIO DE JANEIRO','BRASÍLIA','MANAUS','BELO HORIZONTE','FORTALEZA','PALMEIRA DOS ÍNDIOS'];let phase=1,life=100,ammo=12,kills=0,money=0,wave=1,running=false,last=0,spawn=0,cool=0,reload=0,shots=[],zs=[],items=[],parts=[],blocks=[],boss=null,cam={x:0,y:0},keys={l:0,r:0,u:0,d:0},p={x:180,y:1050,r:18,speed:245,angle:0,inv:0};const MW=5000,MH=2200,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ds=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function hud(){city.textContent=cities[phase-1];ph.textContent=phase;lifeEl.textContent=Math.ceil(life);ammoEl.textContent=reload?'↻':ammo;killEl.textContent=kills;cash.textContent=money;bar.style.width=cl(life,0,100)+'%';mission.textContent=boss?'👹 Derrote o guardião e alcance a saída':`🧟 Onda ${wave} • Abates ${kills%8}/8`}function hitRect(px,py,r,o){const nx=cl(px,o.x,o.x+o.w),ny=cl(py,o.y,o.y+o.h);return Math.hypot(px-nx,py-ny)<r}function blocked(px,py,r){return blocks.some(o=>hitRect(px,py,r,o))}function move(e,dx,dy){if(!blocked(e.x+dx,e.y,e.r))e.x=cl(e.x+dx,e.r,MW-e.r);if(!blocked(e.x,e.y+dy,e.r))e.y=cl(e.y+dy,e.r,MH-e.r)}function build(){blocks=[];for(let X=180;X<MW-260;X+=430)for(let Y=100;Y<MH-240;Y+=350)if(Math.random()>.2)blocks.push({x:X+Math.random()*25,y:Y+Math.random()*25,w:210,h:145});items=[];for(let i=0;i<14;i++)items.push({x:380+i*330,y:220+(i%5)*360,type:i%4===0?'med':'ammo',got:false})}function reset(){phase=1;life=100;ammo=12;kills=0;money=0;wave=1;shots=[];zs=[];parts=[];boss=null;reload=0;cool=0;spawn=.4;p={x:180,y:MH/2,r:18,speed:245,angle:0,inv:0};build();hud()}function fire(){if(!running||reload||cool)return;if(ammo<1){reloadGun();return}ammo--;cool=.14;const a=p.angle;shots.push({x:p.x+Math.cos(a)*24,y:p.y+Math.sin(a)*24,vx:Math.cos(a)*850,vy:Math.sin(a)*850,life:1.2});hud()}function reloadGun(){if(running&&!reload&&ammo<12)reload=.85}function makeZ(){const s=Math.floor(Math.random()*4);let X=s<2?(s?cam.x+W+50:cam.x-50):cam.x+Math.random()*W,Y=s>=2?(s===2?cam.y-50:cam.y+H+50):cam.y+Math.random()*H;X=cl(X,45,MW-45);Y=cl(Y,45,MH-45);const z=Math.random(),kind=z<.14?'bruto':z<.35?'corredor':'comum';zs.push({x:X,y:Y,r:kind==='bruto'?28:18,hp:kind==='bruto'?6+Math.floor(phase/2):kind==='corredor'?1:2,speed:kind==='bruto'?42:kind==='corredor'?118:62,kind,flash:0})}function hurt(n){if(p.inv>0)return;life-=n;p.inv=.5;hud();if(life<=0)over()}function over(){running=false;screen.classList.remove('hide');screen.innerHTML=`<section class="panel"><h1>VOCÊ FOI DERROTADO</h1><p>${cities[phase-1]} foi tomada.</p><p class="small">Abates ${kills} • R$ ${money}</p><button class="go" id="again">TENTAR NOVAMENTE</button></section>`;document.getElementById('again').onclick=start}function bossNew(){boss={x:MW-360,y:MH/2,r:82,hp:38+phase*8,max:38+phase*8,speed:48,flash:0}}function next(){if(phase>=10){running=false;screen.classList.remove('hide');screen.innerHTML='<section class="panel"><h1>🏆 PALMEIRA DOS ÍNDIOS</h1><p>A última cidade foi alcançada. A campanha terminou.</p><button class="go" id="again">JOGAR NOVAMENTE</button></section>';document.getElementById('again').onclick=start;return}phase++;wave=1;kills=0;life=Math.min(100,life+35);ammo=12;shots=[];zs=[];boss=null;p.x=180;p.y=MH/2;build();hud();running=false;screen.classList.remove('hide');screen.innerHTML=`<section class="panel"><h1>🏙️ ${cities[phase-1]}</h1><p>Nova cidade, novos perigos.</p><p class="small">Fase ${phase} de 10</p><button class="go" id="cont">CONTINUAR</button></section>`;document.getElementById('cont').onclick=()=>{screen.classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}}function start(){reset();screen.classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}function update(dt){p.inv=Math.max(0,p.inv-dt);cool=Math.max(0,cool-dt);if(reload){reload-=dt;if(reload<=0)ammo=12;hud()}let dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);if(dx||dy){const n=Math.hypot(dx,dy);move(p,dx/n*p.speed*dt,dy/n*p.speed*dt);p.angle=Math.atan2(dy,dx)}spawn-=dt;if(!boss&&spawn<=0){spawn=Math.max(.22,.72-wave*.018);makeZ()}if(!boss&&wave>=8)bossNew();for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(const z of zs)if(!z.dead&&ds(s,z)<z.r+7){z.hp--;z.flash=.1;s.life=0;if(z.hp<=0){z.dead=true;kills++;money+=z.kind==='bruto'?25:z.kind==='corredor'?8:5;for(let i=0;i<8;i++)parts.push({x:z.x,y:z.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.5});hud()}}if(boss&&!boss.dead&&ds(s,boss)<boss.r+7){boss.hp--;boss.flash=.1;s.life=0;if(boss.hp<=0){boss.dead=true;money+=250;kills++;hud()}}}shots=shots.filter(s=>s.life>0&&s.x>0&&s.x<MW&&s.y>0&&s.y<MH);zs=zs.filter(z=>!z.dead);for(const z of zs){const a=Math.atan2(p.y-z.y,p.x-z.x);const ox=z.x,oy=z.y;move(z,Math.cos(a)*z.speed*dt,Math.sin(a)*z.speed*dt);if(Math.abs(z.x-ox)<.1&&Math.abs(z.y-oy)<.1)move(z,Math.cos(a+1.57)*z.speed*dt*.8,Math.sin(a+1.57)*z.speed*dt*.8);if(ds(p,z)<p.r+z.r)hurt(z.kind==='bruto'?18:8);z.flash=Math.max(0,z.flash-dt)}if(boss&&!boss.dead){const a=Math.atan2(p.y-boss.y,p.x-boss.x);move(boss,Math.cos(a)*boss.speed*dt,Math.sin(a)*boss.speed*dt);if(ds(p,boss)<p.r+boss.r-10)hurt(20*dt);boss.flash=Math.max(0,boss.flash-dt)}if(!boss&&kills%8===0&&kills>0&&wave<8){wave++;hud()}if(boss&&boss.dead&&p.x>MW-190)next();for(const it of items)if(!it.got&&ds(p,it)<32){it.got=true;if(it.type==='med')life=Math.min(100,life+30);else ammo=Math.min(12,ammo+8);hud()}for(const a of parts){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt}parts=parts.filter(a=>a.life>0);cam.x=cl(p.x-W*.42,0,MW-W);cam.y=cl(p.y-H*.47,0,MH-H);hud()}function zombie(z){q.save();q.translate(z.x,z.y);q.fillStyle=z.flash?'#fff':z.kind==='bruto'?'#6d443f':z.kind==='corredor'?'#769366':'#5d775e';q.beginPath();q.arc(0,-18,z.r*.72,0,7);q.fill();q.fillRect(-z.r*.62,-4,z.r*1.24,z.r*1.25);q.fillStyle='#30352f';q.fillRect(-z.r*.55,z.r*.55,z.r*.38,13);q.fillRect(z.r*.17,z.r*.55,z.r*.38,13);q.strokeStyle='#50564e';q.lineWidth=7;q.beginPath();q.moveTo(-z.r*.55,2);q.lineTo(-z.r-9,17);q.moveTo(z.r*.55,2);q.lineTo(z.r+9,17);q.stroke();q.fillStyle='#d94d48';q.beginPath();q.arc(-7,-20,3,0,7);q.arc(7,-20,3,0,7);q.fill();q.fillStyle='#eee';q.fillRect(-8,-10,16,5);q.restore()}function bossDraw(){if(!boss||boss.dead)return;q.save();q.translate(boss.x,boss.y);q.fillStyle='#0006';q.beginPath();q.ellipse(0,68,92,19,0,0,7);q.fill();q.fillStyle=boss.flash?'#fff':'#73797b';q.beginPath();q.ellipse(0,4,78,60,0,0,7);q.fill();q.fillStyle='#565c5f';q.beginPath();q.ellipse(-48,-25,48,42,-.15,0,7);q.fill();q.fillStyle='#383d40';q.beginPath();q.ellipse(-82,-14,32,25,0,0,7);q.fill();q.fillStyle='#151719';q.beginPath();q.arc(-91,-18,4,0,7);q.arc(-82,-8,4,0,7);q.fill();q.fillStyle='#454b4e';q.beginPath();q.ellipse(-55,-65,13,22,-.2,0,7);q.ellipse(-27,-68,13,22,.2,0,7);q.fill();q.fillStyle='#d7c39b';q.beginPath();q.moveTo(-52,-49);q.lineTo(-39,-88);q.lineTo(-27,-48);q.closePath();q.fill();q.fillStyle='#111';q.beginPath();q.arc(-45,-31,7,0,7);q.fill();q.fillStyle='#d8ad48';q.beginPath();q.arc(-44,-31,2.5,0,7);q.fill();q.fillStyle='#292e31';q.fillRect(-25,-15,82,46);q.fillStyle='#8c6b3d';q.fillRect(-22,-3,76,7);q.fillStyle='#4a5053';q.fillRect(-57,24,18,45);q.fillRect(-20,29,19,40);q.fillRect(25,25,19,40);q.fillStyle='#222629';q.fillRect(-63,64,30,10);q.fillRect(-25,64,29,10);q.fillRect(20,64,29,10);q.strokeStyle='#41474a';q.lineWidth=15;q.lineCap='round';q.beginPath();q.moveTo(39,0);q.lineTo(76,35);q.lineTo(82,65);q.stroke();q.fillStyle='#222629';q.beginPath();q.arc(82,68,10,0,7);q.fill();q.save();q.translate(82,68);q.rotate(-.55+Math.sin(performance.now()/180)*.12);q.strokeStyle='#202427';q.lineWidth=8;q.beginPath();q.moveTo(0,0);q.lineTo(22,70);q.stroke();q.fillStyle='#565c60';q.fillRect(8,58,65,18);q.fillStyle='#c4c7c8';q.fillRect(18,61,45,4);q.restore();q.fillStyle='#111';q.fillRect(-52,-100,120,9);q.fillStyle='#d94b51';q.fillRect(-49,-97,114*(boss.hp/boss.max),4);q.restore()}function draw(){q.clearRect(0,0,W,H);q.save();q.translate(-cam.x,-cam.y);q.fillStyle=['#26383e','#273a3d','#20333b','#252a31','#392f30','#34383b','#20382f','#32373c','#40332e','#40362c'][phase-1];q.fillRect(0,0,MW,MH);for(let X=0;X<MW;X+=270)for(let Y=0;Y<MH;Y+=190){q.fillStyle=((X/270+Y/190)%2)?'#30383b':'#293134';q.fillRect(X+4,Y+4,262,182)}for(const o of blocks){q.fillStyle='#4b5a5d';q.fillRect(o.x,o.y,o.w,o.h);q.fillStyle='#202629';for(let a=o.x+18;a<o.x+o.w-10;a+=38)for(let b=o.y+18;b<o.y+o.h-18;b+=38)q.fillRect(a,b,19,20);q.fillStyle='#15191c';q.fillRect(o.x+75,o.y+92,52,48)}for(const it of items)if(!it.got){q.fillStyle=it.type==='med'?'#45b56a':'#d8a63c';q.fillRect(it.x-13,it.y-13,26,26);q.fillStyle='#fff';q.font='bold 17px system-ui';q.textAlign='center';q.fillText(it.type==='med'?'+':'•',it.x,it.y+6)}for(const s of shots){q.fillStyle='#ffd477';q.beginPath();q.arc(s.x,s.y,4,0,7);q.fill()}zs.forEach(zombie);bossDraw();q.save();q.translate(p.x,p.y);q.rotate(p.angle);q.fillStyle=p.inv>0?'#fff':'#cbd1d3';q.beginPath();q.arc(0,0,18,0,7);q.fill();q.fillStyle='#4b565e';q.fillRect(-14,-10,28,20);q.fillStyle='#262c31';q.fillRect(8,-4,28,8);q.fillStyle='#d6ad68';q.fillRect(-7,-25,14,7);q.restore();for(const a of parts){q.globalAlpha=Math.max(0,a.life*2);q.fillStyle='#d75a4e';q.fillRect(a.x,a.y,4,4);q.globalAlpha=1}q.fillStyle='#d5b44f';q.fillRect(MW-180,MH/2-130,10,260);q.fillStyle='#d84a45';q.beginPath();q.moveTo(MW-170,MH/2-125);q.lineTo(MW-65,MH/2-95);q.lineTo(MW-170,MH/2-65);q.fill();q.restore()}function loop(t){if(!running)return;const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;update(dt);draw();requestAnimationFrame(loop)}function hold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();keys[k]=0}))}hold('l','l');hold('r','r');hold('u','u');hold('d','d');document.getElementById('fi').addEventListener('pointerdown',e=>{e.preventDefault();fire()});document.getElementById('re').addEventListener('pointerdown',e=>{e.preventDefault();reloadGun()});go.onclick=start;reset();draw()})();</script></body></html>
