<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Rush — Night Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%}
.hud{position:absolute;z-index:5;inset:14px 14px auto;display:flex;justify-content:space-between;pointer-events:none}
.badge{padding:8px 12px;border:1px solid #ffffff28;border-radius:14px;background:#080c13b8;backdrop-filter:blur(10px);font-weight:800}
.speed{font-size:30px;line-height:.9;text-align:right}.speed small{display:block;font-size:10px;letter-spacing:.18em;opacity:.65}
.controls{position:absolute;z-index:8;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}.ctrl{width:62px;height:62px;border-radius:50%;border:1px solid #ffffff30;background:#07101dcc;color:#fff;font-size:22px;font-weight:900;box-shadow:0 8px 22px #0008;touch-action:none}
#gas{width:88px;border-radius:18px;font-size:12px;letter-spacing:.08em}
.loading{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#05070b;color:#fff;font-weight:800;letter-spacing:.08em}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<div id="loading" class="loading">CARREGANDO CIDADE 3D…</div>
<div class="hud"><div class="badge">STREET RUSH<br><small style="opacity:.55">NIGHT RUN • PROTOTYPE 01</small></div><div class="speed"><small>KM/H</small><span id="speed">0</span><small style="margin-top:4px">KM <span id="distance">0.00</span></small></div></div>
<div class="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl" id="gas">ACELERAR</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{
const loading=document.getElementById('loading'),hideLoading=()=>loading.classList.add('hidden');
if(!window.THREE){loading.textContent='ERRO AO CARREGAR O MOTOR 3D';return}
const root=document.getElementById('game'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070b);scene.fog=new THREE.FogExp2(0x0a0e17,0.014);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);camera.position.set(0,3.15,8.4);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9fb7ff,0x11141a,1.25));const moon=new THREE.DirectionalLight(0xb8c8ff,2.2);moon.position.set(-30,45,25);scene.add(moon);
const world=new THREE.Group();scene.add(world);
const roadMat=new THREE.MeshStandardMaterial({color:0x25272b,roughness:.82}),sidewalkMat=new THREE.MeshStandardMaterial({color:0x555960,roughness:.92}),lineMat=new THREE.MeshStandardMaterial({color:0xe7e2d0,roughness:.5}),darkMat=new THREE.MeshStandardMaterial({color:0x101318,roughness:.9});
function box(w,h,d,mat,x,y,z,parent=world){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
box(14,.18,2200,roadMat,0,-.08,-1050);box(2,.22,2200,sidewalkMat,-8,.02,-1050);box(2,.22,2200,sidewalkMat,8,.02,-1050);
for(let z=8;z>-2100;z-=12){box(.12,.025,6,lineMat,-2.35,.025,z);box(.12,.025,6,lineMat,2.35,.025,z)}
const buildingMats=[0x1b2029,0x242a35,0x30343b,0x171b22];
for(let z=4;z>-2050;z-=18){for(const side of [-1,1]){const h=7+Math.random()*18,w=5+Math.random()*7,d=11+Math.random()*6,x=side*(11+Math.random()*4);const m=box(w,h,d,new THREE.MeshStandardMaterial({color:buildingMats[Math.floor(Math.random()*buildingMats.length)],roughness:.85}),x,h/2,z+Math.random()*6);const wm=new THREE.MeshBasicMaterial({color:0xd8c58a});for(let yy=3;yy<h-1;yy+=2.8)for(let xx=-w*.32;xx<w*.33;xx+=1.7){const win=new THREE.Mesh(new THREE.PlaneGeometry(.75,.95),wm);win.position.set(x+xx,yy,m.position.z-d/2-.01);win.rotation.y=side===1?Math.PI:0;world.add(win)}}}
function streetLight(x,z){box(.09,5.2,.09,darkMat,x,2.6,z);box(1,.08,.08,darkMat,x+(x<0?-.45:.45),5.05,z);const glow=new THREE.PointLight(0xffdca3,18,14,2);glow.position.set(x+(x<0?-.9:.9),4.85,z);world.add(glow);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.09,12,8),new THREE.MeshBasicMaterial({color:0xffe5b2}));bulb.position.copy(glow.position);world.add(bulb)}
for(let z=3;z>-2050;z-=14){streetLight(-7.3,z);streetLight(7.3,z-7)}

const car=new THREE.Group();scene.add(car);let carReady=false;
function createFallbackCar(){
if(carReady)return;car.clear();
const bodyMat=new THREE.MeshStandardMaterial({color:0x263b68,metalness:.72,roughness:.24}),dark=new THREE.MeshStandardMaterial({color:0x0b0d12,metalness:.15,roughness:.35}),glass=new THREE.MeshStandardMaterial({color:0x101d2c,metalness:.2,roughness:.08}),lightMat=new THREE.MeshBasicMaterial({color:0xffffff}),redMat=new THREE.MeshBasicMaterial({color:0xff2020});
const body=new THREE.Mesh(new THREE.BoxGeometry(2.15,.48,4.25),bodyMat);body.position.y=.62;body.castShadow=true;car.add(body);
const hood=new THREE.Mesh(new THREE.BoxGeometry(1.92,.22,1.2),bodyMat);hood.position.set(0,.88,-1.28);hood.rotation.x=-.04;hood.castShadow=true;car.add(hood);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.62,.58,1.75),glass);cabin.position.set(0,1.05,.15);cabin.castShadow=true;car.add(cabin);
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.72,.12,1.65),bodyMat);roof.position.set(0,1.37,.16);car.add(roof);
for(const x of [-1.03,1.03])for(const z of [-1.38,1.38]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.24,18),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.42,z);wheel.castShadow=true;car.add(wheel)}
for(const x of [-.62,.62]){const a=new THREE.Mesh(new THREE.BoxGeometry(.28,.13,.08),lightMat);a.position.set(x,.73,-2.15);car.add(a);const b=new THREE.Mesh(new THREE.BoxGeometry(.32,.14,.08),redMat);b.position.set(x,.72,2.15);car.add(b)}
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(2.5,4.8),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.32}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.03;car.add(shadow);
car.position.set(0,0,1.2);car.rotation.y=Math.PI;carReady=true;
}
if(THREE.GLTFLoader){const loader=new THREE.GLTFLoader();loader.load('https://threejs.org/examples/models/gltf/ferrari.glb',g=>{while(car.children.length)car.remove(car.children[0]);const model=g.scene.children[0]||g.scene;model.scale.setScalar(1.15);model.position.set(0,.02,0);model.rotation.y=Math.PI;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});car.add(model);carReady=true;hideLoading()},undefined,()=>{loading.textContent='NÃO FOI POSSÍVEL CARREGAR O CARRO 3D';loading.style.background='#05070b';});}else {loading.textContent='ERRO AO CARREGAR O CARRO 3D';}

let steer=0,gas=false,speed=0,distance=0,last=performance.now();
car.position.set(0,0,0);
function bind(id,down,up){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();down()});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();up()}))}
bind('left',()=>steer=-1,()=>{if(steer<0)steer=0});bind('right',()=>steer=1,()=>{if(steer>0)steer=0});bind('gas',()=>gas=true,()=>gas=false);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')steer=-1;if(e.key==='ArrowRight')steer=1;if(e.key==='ArrowUp'||e.key===' ')gas=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'&&steer<0)steer=0;if(e.key==='ArrowRight'&&steer>0)steer=0;if(e.key==='ArrowUp'||e.key===' ')gas=false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

function animate(now){
const dt=Math.min((now-last)/1000,.04);last=now;const target=gas?145:0,acceleration=gas?48:62;
if(speed<target)speed=Math.min(target,speed+acceleration*dt);else speed=Math.max(target,speed-62*dt);
const forward=speed*dt*.055;
if(carReady){car.position.x=THREE.MathUtils.damp(car.position.x,steer*4.15,.11,dt);car.rotation.z=THREE.MathUtils.damp(car.rotation.z,-steer*.065,.1,dt)}
if(speed>0.1){car.position.z-=forward;distance+=forward}
const targetCamX=car.position.x*.70,targetCamZ=car.position.z+8.4;camera.position.x=THREE.MathUtils.damp(camera.position.x,targetCamX,.12,dt);camera.position.z=THREE.MathUtils.damp(camera.position.z,targetCamZ,.12,dt);camera.lookAt(car.position.x*.48,1.0,car.position.z-2.5);
document.getElementById('speed').textContent=Math.round(speed);document.getElementById('distance').textContent=(distance/1000).toFixed(2);renderer.render(scene,camera);requestAnimationFrame(animate)
}
hideLoading();requestAnimationFrame(animate);
})();
</script>
</body>
</html>
